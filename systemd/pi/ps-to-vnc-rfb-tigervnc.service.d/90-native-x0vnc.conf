# PS-to-VNC native Raspberry Pi desktop provider.
#
# Raspberry Pi OS owns the graphical desktop on Xorg display :0.
# X0tigervnc does not create another desktop; it exposes the existing :0
# framebuffer and injects pointer/keyboard input into that same session.
#
# The generic ps-to-vnc-rfb.socket remains the PS2-facing endpoint owner.
# X0tigervnc consumes that socket through native systemd socket activation.

[Unit]
Requires=lightdm.service
After=lightdm.service

[Service]
Environment=DISPLAY=:0
Environment=XAUTHORITY=/home/ps2/.Xauthority

# The historical Xtigervnc :1 provider used inetd-style stdin handoff.
# X0tigervnc instead consumes LISTEN_FDS from systemd.
StandardInput=null
StandardOutput=journal
StandardError=journal

ExecStart=
ExecStart=/usr/bin/X0tigervnc -display :0 -rfbport -1 -SecurityTypes None -AlwaysShared=1 -AcceptPointerEvents=1 -AcceptKeyEvents=1 -AcceptSetDesktopSize=0 -UseIPv6=0

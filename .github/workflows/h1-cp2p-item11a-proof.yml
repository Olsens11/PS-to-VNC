name: H1 CP2P Item 11A Proof

on:
  push:
    branches:
      - experiment/h1-cp2p-pi-retirement-control
    paths:
      - .github/workflows/h1-cp2p-item11a-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/h1-cp2p-pi-retirement-control

      - name: Prove item 11A host contracts and prior Pi contracts
        working-directory: experiments/media-harness-h1
        run: |
          set -eu
          python3 h1_cp2p_start_receiver_test.py
          python3 h1_rfb_pi_bridge_test.py
          python3 h1_cp2p_rfb_suppression_test.py
          python3 h1_cp2p_capture_geometry_test.py
          python3 h1_cp2p_start_preparation_transaction_test.py
          python3 h1_cp2p_retirement_control_test.py
          make -C mpeg_presentation_calibration -f Makefile.host clean
          make -C mpeg_presentation_calibration -f Makefile.host test
          echo H1_CP2P_ITEM11A_HOST_CONTRACTS=PASS

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/h1-cp2p-pi-retirement-control

      - name: Build CP2O regression and CP2P retirement target in pinned PS2DEV image
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        run: |
          set -eu
          SOURCE_COMMIT=$(git rev-parse HEAD)
          docker run --rm \
            --entrypoint /bin/sh \
            -e SOURCE_COMMIT="$SOURCE_COMMIT" \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

              CP2O_BUILD=build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2
              CP2P_BUILD=build/experiments/media-harness-h1-cp2p-application-link/ps2
              CP2O_ELF="$CP2O_BUILD/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF"
              CP2P_ELF="$CP2P_BUILD/PS2VNC-H1-CP2P-ApplicationLink.ELF"
              rm -rf "$CP2O_BUILD" "$CP2P_BUILD"

              make -f mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk
              python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$CP2O_BUILD"
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2O_BUILD"
              test -f "$CP2O_ELF"
              echo H1_CP2O_CURRENT_TREE_REGRESSION=PASS

              make -f mk/media-harness-h1-cp2p-application-link.mk cp2p-application-link-check
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2P_BUILD"
              test -f "$CP2P_ELF"

              mips64r5900el-ps2-elf-nm "$CP2P_ELF" > cp2p-item11a-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_retire_begin$" cp2p-item11a-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_retire_poll$" cp2p-item11a-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_cp2p_session_coordinator_service$" cp2p-item11a-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_cp2p_mpeg_worker_clear$" cp2p-item11a-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_read_cancellable$" cp2p-item11a-symbols.txt
              test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_init$" cp2p-item11a-symbols.txt)" -eq 1
              test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_present$" cp2p-item11a-symbols.txt)" -eq 1
              test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_shutdown$" cp2p-item11a-symbols.txt)" -eq 1

              grep -Fq "config->video_mode != PSTVNC_H1_VIDEO_OFF" experiments/media-harness-h1/h1_main_cp2p_visible_interaction_pcm.c
              echo H1_CP2P_ITEM10_GATE_UNCHANGED=PASS
              echo H1_CP2P_ITEM11A_PS2_LINK=PASS
              echo H1_CP2P_ITEM11A_EXACT_RETIRE_CONTROL=PASS
              echo H1_CP2P_ITEM11A_SINGLE_TRANSPORT_READER=PASS

              {
                echo "SOURCE_COMMIT=$SOURCE_COMMIT"
                sha256sum "$CP2P_ELF"
                stat -c "ELF_BYTES=%s" "$CP2P_ELF"
                ./scripts/testkit/pt-load-fingerprint.sh "$CP2P_ELF"
              } | tee cp2p-item11a-identity.txt
            '

      - uses: actions/upload-artifact@v4
        with:
          name: h1-cp2p-item11a-unqualified-elf
          path: |
            build/experiments/media-harness-h1-cp2p-application-link/ps2/PS2VNC-H1-CP2P-ApplicationLink.ELF
            cp2p-item11a-identity.txt
            cp2p-item11a-symbols.txt
          if-no-files-found: error

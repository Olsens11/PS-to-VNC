name: H1 CP2P Item 8 Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-start-driven-producer

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote item 8 authorities and remove temporary machinery
        run: python3 experiments/media-harness-h1/.item8_seal.py

      - name: Verify sealed state
        run: |
          set -euo pipefail
          CONTRACT=experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          grep -Fq 'item #8 START-driven MPEG production is DONE at the pre-public-gate software boundary' "$CONTRACT"
          grep -Fq '0347e2f1a0295a83aa7051fc9b963b7f3ece85a2' "$CONTRACT"
          grep -Fq '34712568840' "$CONTRACT"
          test "$(grep -c '^## 41\. Item #8' "$HISTORY")" -eq 1
          grep -Fq 'H1_CP2P_ITEM8_PUBLIC_GATE=CLOSED' "$HISTORY"
          grep -Fq '**#11B -> #10 -> #12**' "$HISTORY"
          for path in \
            .github/workflows/h1-cp2p-item8-producer.yml \
            experiments/media-harness-h1/.item8_patch.py \
            experiments/media-harness-h1/.item8_patch_fix.py \
            experiments/media-harness-h1/.item8_safety_patch.py \
            experiments/media-harness-h1/.item8_seal.py; do
            test ! -e "$path"
          done
          git diff --check
          git status --short
          echo H1_CP2P_ITEM8_SEALED_STATE=PASS

      - name: Commit seal
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(h1): seal CP2P item 8 checkpoint'
          git push origin HEAD:experiment/h1-cp2p-start-driven-producer

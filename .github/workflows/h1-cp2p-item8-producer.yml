name: H1 CP2P Item 8 Producer
# Final committed-source verification trigger for item #8.

on:
  push:
    branches:
      - experiment/h1-cp2p-start-driven-producer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-shot item 8 patches
        run: |
          python3 experiments/media-harness-h1/.item8_patch_fix.py
          python3 experiments/media-harness-h1/.item8_patch.py
          python3 experiments/media-harness-h1/.item8_safety_patch.py

      - name: Compile and prove Pi CP2P contracts
        working-directory: experiments/media-harness-h1
        run: |
          python3 -m py_compile \
            h1_cp2p_mpeg_producer.py \
            h1_cp2p_mpeg_producer_test.py \
            h1_cp2p_start_receiver.py \
            h1_cp2p_rfb_suppression.py \
            h1_cp2p_capture_geometry.py \
            h1_cp2p_retirement_control.py \
            h1_mux_server_cp2p_start_receiver.py
          python3 h1_cp2p_start_receiver_test.py
          python3 h1_rfb_pi_bridge_test.py
          python3 h1_cp2p_rfb_suppression_test.py
          python3 h1_cp2p_capture_geometry_test.py
          python3 h1_cp2p_start_preparation_transaction_test.py
          python3 h1_cp2p_retirement_control_test.py
          python3 h1_cp2p_mpeg_producer_test.py

      - name: Prove full calibration host suite unchanged
        working-directory: experiments/media-harness-h1/mpeg_presentation_calibration
        run: |
          make -f Makefile.host clean
          make -f Makefile.host test

      - name: Prove item 8 gate boundary statically
        working-directory: experiments/media-harness-h1
        run: |
          grep -Fq 'live-local-producer-public-mpeg-gate-closed' h1_cp2p_mpeg_producer.py
          grep -Fq 'pstv_mpeg_data_emission": False' h1_cp2p_mpeg_producer.py
          if grep -Eq 'send_frame|_send_from|CHANNEL_MPEG2' h1_cp2p_mpeg_producer.py; then
            echo 'item #8 producer owner must not emit PSTV MPEG DATA before #10' >&2
            exit 1
          fi
          grep -Fq 'suppression retained fail-closed' h1_mux_server_cp2p_start_receiver.py
          grep -Fq 'CP2O runner requires MPEG/video OFF' h1_mux_server_cumulative39_rfb_pcm_bridge.py
          echo H1_CP2P_ITEM8_PUBLIC_GATE=CLOSED

      - name: Verify patch cleanliness
        run: |
          git diff --check
          git status --short

      - name: Commit implementation when patch changed the tree
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo ITEM8_COMMIT=ALREADY_PRESENT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'h1: harden START-driven producer rollback ordering'
          git push origin HEAD:experiment/h1-cp2p-start-driven-producer

  ps2-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-shot item 8 patches
        run: |
          python3 experiments/media-harness-h1/.item8_patch_fix.py
          python3 experiments/media-harness-h1/.item8_patch.py
          python3 experiments/media-harness-h1/.item8_safety_patch.py
      - name: Build linked CP2P PS2 target in pinned PS2DEV image
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              BUILD=build/experiments/media-harness-h1-cp2p-application-link/ps2
              ELF="$BUILD/PS2VNC-H1-CP2P-ApplicationLink.ELF"
              rm -rf "$BUILD"
              make -f mk/media-harness-h1-cp2p-application-link.mk cp2p-application-link-check
              mips64r5900el-ps2-elf-nm "$ELF" > item8-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_cp2p_mpeg_worker_arm$" item8-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_retire_begin$" item8-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_retire_poll$" item8-symbols.txt
              echo H1_CP2P_ITEM8_PS2_REGRESSION=PASS
              sha256sum "$ELF"
              stat -c "ELF_BYTES=%s" "$ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$ELF"
            '

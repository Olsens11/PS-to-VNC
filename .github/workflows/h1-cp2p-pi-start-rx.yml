name: H1 CP2P Pi START receive proof

on:
  push:
    branches: [experiment/h1-cp2p-pi-start-receive-validation]
    paths:
      - 'experiments/media-harness-h1/h1_cp2p_start_receiver.py'
      - 'experiments/media-harness-h1/h1_cp2p_start_receiver_test.py'
      - 'experiments/media-harness-h1/h1_mux_server_cp2p_start_receiver.py'
      - 'experiments/media-harness-h1/CP2P_PI_START_RECEIVE_VALIDATION.md'
      - '.github/workflows/h1-cp2p-pi-start-rx.yml'

permissions:
  contents: read

jobs:
  host-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: |
          set -eu
          cd experiments/media-harness-h1
          python3 -m py_compile \
            h1_cp2p_start_receiver.py \
            h1_cp2p_start_receiver_test.py \
            h1_mux_server_cp2p_start_receiver.py
          echo H1_CP2P_PI_START_PYCOMPILE=PASS
      - name: Run START receive/validation tests
        run: |
          set -eu
          cd experiments/media-harness-h1
          python3 h1_cp2p_start_receiver_test.py
          echo H1_CP2P_PI_START_RECEIVE_HOST_TEST=PASS
      - name: Regress RFB receive chain
        run: |
          set -eu
          cd experiments/media-harness-h1
          python3 h1_rfb_pi_bridge_test.py
          python3 h1_rfb_session_adapter_test.py
          python3 h1_mux_server_cumulative39_rfb_bridge_test.py
          echo H1_CP2P_PI_START_RFB_REGRESSION=PASS
      - name: Validate inert CP2P runner import/profile path
        run: |
          set -eu
          cd experiments/media-harness-h1
          python3 h1_mux_server_cp2p_start_receiver.py \
            --profile H1_RFB_ONLY \
            --duration 1 \
            --validate-only
          echo H1_CP2P_PI_START_RUNNER_VALIDATE=PASS
      - name: Enforce item-5 proof boundary
        run: |
          set -eu
          cd experiments/media-harness-h1
          ! grep -q 'threading\.Thread(' h1_cp2p_start_receiver.py
          ! grep -q 'subprocess\.Popen' h1_cp2p_start_receiver.py
          ! grep -q 'socket\.socket' h1_cp2p_start_receiver.py
          grep -q 'FRAME_DATA' h1_cp2p_start_receiver.py
          grep -q 'CHANNEL_MPEG2' h1_cp2p_start_receiver.py
          grep -q 'MPEG_START_WIRE_BYTES = MPEG_START_WIRE_WORDS \* 4' h1_cp2p_start_receiver.py
          echo H1_CP2P_PI_START_BOUNDARY=PASS

name: H1 RFB mux preparation checks

on:
  push:
    branches:
      - experiment/h1-rfb-mux-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify H1 CONFIG v4 profiles
        run: python3 experiments/media-harness-h1/h1_profiles.py
      - name: Verify H1 RFB mux seam source ownership
        run: python3 experiments/media-harness-h1/check_rfb_mux_seam.py
      - name: Verify headless H1 RFB session coordinator source ownership
        run: python3 experiments/media-harness-h1/check_rfb_session_coordinator.py
      - name: Verify CP2K visible RFB presentation contract
        run: python3 experiments/media-harness-h1/check_rfb_visible_presentation.py
      - name: Verify CP2L visible RFB mouse-input contract
        run: python3 experiments/media-harness-h1/check_rfb_visible_input.py
      - name: Verify CP2M visible RFB keyboard contract
        run: python3 experiments/media-harness-h1/check_rfb_visible_keyboard.py
      - name: Test CP2M pure Test11F keyboard chord router
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Isrc/input \
            -Iexperiments/media-harness-h1 \
            experiments/media-harness-h1/h1_rfb_keyboard_chord.c \
            experiments/media-harness-h1/h1_rfb_keyboard_chord_test.c \
            -o /tmp/h1_rfb_keyboard_chord_test
          /tmp/h1_rfb_keyboard_chord_test
      - name: Verify CP2N real-module visible RFB interaction contract
        run: python3 experiments/media-harness-h1/check_rfb_visible_interaction.py
      - name: Test cumulative-only RFB CONFIG activation gate
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Iexperiments/media-harness-h1 \
            -Iexperiments/audio-transport/common \
            -Dpstvnc_h1_config_validate=pstvnc_h1_config_validate_inner \
            -c experiments/media-harness-h1/h1_config.c \
            -o /tmp/h1_config_rfb_gate_inner.o
          cc -std=c99 -Wall -Wextra -Werror \
            -Iexperiments/media-harness-h1 \
            -Iexperiments/audio-transport/common \
            /tmp/h1_config_rfb_gate_inner.o \
            experiments/media-harness-h1/h1_config_rfb_activation_gate.c \
            experiments/media-harness-h1/h1_config_rfb_activation_gate_test.c \
            experiments/audio-transport/common/transport_protocol.c \
            -o /tmp/h1_config_rfb_activation_gate_test
          /tmp/h1_config_rfb_activation_gate_test
      - name: Test H1 logical RFB channel mechanics
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Iexperiments/media-harness-h1 \
            -Iexperiments/audio-transport/common \
            experiments/media-harness-h1/h1_rfb_channel.c \
            experiments/audio-transport/common/transport_queue.c \
            experiments/media-harness-h1/h1_rfb_channel_test.c \
            -o /tmp/h1_rfb_channel_test
          /tmp/h1_rfb_channel_test
      - name: Test H1 logical RFB credit policy
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -Iexperiments/media-harness-h1 \
            experiments/media-harness-h1/h1_rfb_credit_policy.c \
            experiments/media-harness-h1/h1_rfb_credit_policy_test.c \
            -o /tmp/h1_rfb_credit_policy_test
          /tmp/h1_rfb_credit_policy_test
      - name: Test H1 Pi RFB byte bridge
        run: python3 experiments/media-harness-h1/h1_rfb_pi_bridge_test.py
      - name: Test H1 reader-to-RFB bridge integration
        run: python3 experiments/media-harness-h1/h1_rfb_session_adapter_test.py
      - name: Test cumulative H1 RFB bridge runner composition
        run: python3 experiments/media-harness-h1/h1_mux_server_cumulative39_rfb_bridge_test.py
      - name: Validate first RFB-only operator profile through cumulative bridge runner
        run: |
          python3 experiments/media-harness-h1/h1_mux_server_cumulative39_rfb_bridge.py \
            --profile H1_RFB_ONLY \
            --duration 1 \
            --validate-only
      - name: Verify H1 operator control surface remains readable
        run: |
          python3 experiments/media-harness-h1/h1_tool.py --help >/dev/null
          python3 experiments/media-harness-h1/h1_tool.py run --help >/dev/null
          python3 experiments/media-harness-h1/h1_tool.py sweep --help >/dev/null
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile P11_COMPAT_PLUS_PCM >/dev/null
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile P11_COMPAT_PLUS_PCM | grep -q rfb_queue_capacity
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile P11_COMPAT_PLUS_PCM | grep -q rfb_credit_batch_bytes
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile P11_COMPAT_PLUS_PCM | grep -q rfb_credit_flush_on_empty
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile P11_COMPAT_PLUS_PCM | grep -q rfb_credit_return_enabled
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile P11_COMPAT_PLUS_PCM | grep -q rfb_initial_credit_bytes
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile H1_RFB_ONLY | grep -q 'rfb_queue_capacity.*32768'
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile H1_RFB_ONLY | grep -q 'rfb_credit_batch_bytes.*8192'
          python3 experiments/media-harness-h1/h1_tool.py knobs --profile H1_RFB_ONLY | grep -q 'rfb_initial_credit_bytes.*32768'

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cumulative H1 RFB-prep, CP2K, CP2L, CP2M, and CP2N candidates with pinned PS2 toolchain
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

              make -f mk/media-harness-h1-cumulative39-thread-census.mk
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py \
                --build-dir build/experiments/media-harness-h1-cumulative39-thread-census/ps2
              python3 experiments/media-harness-h1/check_rfb_session_coordinator.py \
                --build-dir build/experiments/media-harness-h1-cumulative39-thread-census/ps2
              ELF=build/experiments/media-harness-h1-cumulative39-thread-census/ps2/PS2VNC-H1-Cumulative39-ThreadCensus.ELF
              echo H1_HEADLESS_ELF_BEGIN
              sha256sum "$ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$ELF"
              echo H1_HEADLESS_ELF_END

              make -f mk/media-harness-h1-cp2k-visible-rfb.mk
              python3 experiments/media-harness-h1/check_rfb_visible_presentation.py
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py \
                --build-dir build/experiments/media-harness-h1-cp2k-visible-rfb/ps2
              CP2K_ELF=build/experiments/media-harness-h1-cp2k-visible-rfb/ps2/PS2VNC-H1-CP2K-VisibleRFB.ELF
              echo H1_CP2K_ELF_BEGIN
              sha256sum "$CP2K_ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$CP2K_ELF"
              echo H1_CP2K_ELF_END

              make -f mk/media-harness-h1-cp2l-visible-rfb-input.mk
              python3 experiments/media-harness-h1/check_rfb_visible_input.py \
                --build-dir build/experiments/media-harness-h1-cp2l-visible-rfb-input/ps2
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py \
                --build-dir build/experiments/media-harness-h1-cp2l-visible-rfb-input/ps2
              CP2L_ELF=build/experiments/media-harness-h1-cp2l-visible-rfb-input/ps2/PS2VNC-H1-CP2L-VisibleRFBInput.ELF
              echo H1_CP2L_ELF_BEGIN
              sha256sum "$CP2L_ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$CP2L_ELF"
              echo H1_CP2L_ELF_END

              make -f mk/media-harness-h1-cp2m-visible-rfb-keyboard.mk
              python3 experiments/media-harness-h1/check_rfb_visible_keyboard.py \
                --build-dir build/experiments/media-harness-h1-cp2m-visible-rfb-keyboard/ps2
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py \
                --build-dir build/experiments/media-harness-h1-cp2m-visible-rfb-keyboard/ps2
              CP2M_ELF=build/experiments/media-harness-h1-cp2m-visible-rfb-keyboard/ps2/PS2VNC-H1-CP2M-VisibleRFBKeyboard.ELF
              echo H1_CP2M_ELF_BEGIN
              sha256sum "$CP2M_ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$CP2M_ELF"
              echo H1_CP2M_ELF_END

              make -f mk/media-harness-h1-cp2n-visible-rfb-interaction.mk
              python3 experiments/media-harness-h1/check_rfb_visible_interaction.py \
                --build-dir build/experiments/media-harness-h1-cp2n-visible-rfb-interaction/ps2
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py \
                --build-dir build/experiments/media-harness-h1-cp2n-visible-rfb-interaction/ps2
              CP2N_ELF=build/experiments/media-harness-h1-cp2n-visible-rfb-interaction/ps2/PS2VNC-H1-CP2N-VisibleRFBInteraction.ELF
              echo H1_CP2N_ELF_BEGIN
              sha256sum "$CP2N_ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$CP2N_ELF"
              echo H1_CP2N_ELF_END
            '
      - name: Preserve unqualified RFB-prep ELF
        uses: actions/upload-artifact@v4
        with:
          name: h1-rfb-mux-prep-unqualified-elf
          path: build/experiments/media-harness-h1-cumulative39-thread-census/ps2/PS2VNC-H1-Cumulative39-ThreadCensus.ELF
          if-no-files-found: error
      - name: Preserve unqualified CP2K visible RFB ELF
        uses: actions/upload-artifact@v4
        with:
          name: h1-cp2k-visible-rfb-unqualified-elf
          path: build/experiments/media-harness-h1-cp2k-visible-rfb/ps2/PS2VNC-H1-CP2K-VisibleRFB.ELF
          if-no-files-found: error
      - name: Preserve unqualified CP2L visible RFB input ELF
        uses: actions/upload-artifact@v4
        with:
          name: h1-cp2l-visible-rfb-input-unqualified-elf
          path: build/experiments/media-harness-h1-cp2l-visible-rfb-input/ps2/PS2VNC-H1-CP2L-VisibleRFBInput.ELF
          if-no-files-found: error
      - name: Preserve unqualified CP2M visible RFB keyboard ELF
        uses: actions/upload-artifact@v4
        with:
          name: h1-cp2m-visible-rfb-keyboard-unqualified-elf
          path: build/experiments/media-harness-h1-cp2m-visible-rfb-keyboard/ps2/PS2VNC-H1-CP2M-VisibleRFBKeyboard.ELF
          if-no-files-found: error
      - name: Preserve unqualified CP2N visible RFB interaction ELF
        uses: actions/upload-artifact@v4
        with:
          name: h1-cp2n-visible-rfb-interaction-unqualified-elf
          path: build/experiments/media-harness-h1-cp2n-visible-rfb-interaction/ps2/PS2VNC-H1-CP2N-VisibleRFBInteraction.ELF
          if-no-files-found: error

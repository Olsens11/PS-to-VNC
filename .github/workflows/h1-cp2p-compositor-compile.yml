name: H1 CP2P shared compositor compile diagnostic

on:
  push:
    branches:
      - experiment/h1-rfb-mux-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps2-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile dormant calibrated compositor with pinned PS2 toolchain
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              make -f mk/media-harness-h1-cp2p-compositor-check.mk cp2p-compositor-check
            '

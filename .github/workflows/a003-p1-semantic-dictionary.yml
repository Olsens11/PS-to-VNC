name: A003 P1 semantic dictionary candidate

on:
  push:
    branches:
      - evidence/a003-p1-host-20260916

permissions:
  contents: write

jobs:
  semantic-dictionary:
    if: startsWith(github.event.head_commit.message, 'test(a003) run semantic')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install definition discovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y universal-ctags shfmt
      - name: Build and verify source-owned candidates
        run: |
          python3 .github/a003_dictionary_candidate.py
          python3 scripts/source-dictionary.py check --long --require-complete --strict
          git diff --check
      - name: Commit candidate dictionaries only
        run: |
          git config user.name 'PS-to-VNC A003 reconstruction evidence'
          git config user.email '39144541+Olsens11@users.noreply.github.com'
          git add src/transport/SYMBOLS.md src/mpeg/SYMBOLS.md
          git commit -m 'docs(a003): stage semantic source dictionaries'
          git push origin HEAD:evidence/a003-p1-host-20260916

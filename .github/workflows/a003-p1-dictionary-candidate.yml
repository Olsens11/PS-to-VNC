              'picture_result': 'the injected decoder picture-call return code classified after call ownership returns',
              'width': 'the decoder-reported sequence width to validate before surface use',
              'height': 'the decoder-reported sequence height to validate before surface use',
              'required': 'the checked picture bytes required by the reported sequence dimensions',
              'sequence_seen': 'whether a valid decoder sequence callback has established picture dimensions',
              'sequence_invalid': 'whether a decoder sequence callback violated the caller bounds',
              'feed_exhausted': 'whether Transport reported real finite-producer exhaustion to the active decoder call',
              'feed_failed': 'whether the decoder feed callback observed a non-exhaustion Transport failure',
              'feed_transport_result': 'the exact Transport result retained when feed cannot continue',
              'decoder_initialized': 'whether the injected decoder requires destruction during release',
              'known_state_prepared': 'whether known decoder platform state has been acquired and must be released',
              'decoder_call_active': 'whether an injected decoder picture call currently owns decoder-visible resources',
              'initialized': 'whether the decoder owner completed resource and state acquisition',
              'feed_buffer': 'the decoder-owned aligned feed staging buffer',
              'picture_buffer': 'the decoder-owned bounded picture surface',
              'feed_payload_capacity': 'the maximum real payload bytes one decoder feed callback may consume',
              'transfer_alignment': 'the platform transfer alignment applied only after real payload accounting',
              'buffer_alignment': 'the allocation alignment required for decoder-visible buffers',
              'max_width': 'the caller-authorized maximum sequence width',
              'max_height': 'the caller-authorized maximum sequence height',
              'bytes_per_pixel': 'the caller-authorized decoded picture byte width per pixel',
              'allocate': 'the injected aligned allocation operation for decoder-owned buffers',
              'release': 'the injected operation that releases decoder-owned memory or platform state',
              'lock': 'the injected lock operation protecting owner stop and call-lifetime state',
              'unlock': 'the matching injected unlock operation',
              'prepare_known_state': 'the platform operation that establishes known decoder/IPU-DMAC state before initialization',
              'initialize': 'the platform operation that initializes the decoder with sequence and feed callbacks',
              'picture': 'the platform decoder picture/decode call whose lifetime owns decoder-visible resources',
              'submit_feed': 'the platform operation that receives one padded transfer while preserving real payload accounting',
              'destroy': 'the platform operation that destroys an initialized decoder after call ownership returns',
              'release_known_state': 'the platform operation that releases prepared decoder state after destruction',
              'sequence_width': 'the validated decoder sequence width recorded for the caller',
              'sequence_height': 'the validated decoder sequence height recorded for the caller',
              'pictures_decoded': 'the number of successful decoder picture calls reported by the core',
              'feed_callbacks': 'the number of decoder data-callback requests serviced',
              'payload_bytes_consumed': 'the sum of real MPEG payload bytes removed from Transport',
              'transfer_bytes_submitted': 'the sum of padded aligned bytes submitted to the platform decoder',
          }

          enum_meaning = {
              'PSTVNC_MPEG_DECODER_COMPLETE': 'Reports real finite MPEG exhaustion after the decoder call returns normally.',
              'PSTVNC_MPEG_DECODER_STOPPED': 'Reports owner-requested cancellation observed only outside an active decoder call.',
              'PSTVNC_MPEG_DECODER_INVALID': 'Reports invalid decoder arguments, configuration, or owner state.',
              'PSTVNC_MPEG_DECODER_ALLOCATION_FAILED': 'Reports failure to acquire one of the bounded decoder-owned buffers.',
              'PSTVNC_MPEG_DECODER_PREPARE_FAILED': 'Reports failure to establish the required known decoder platform state.',
              'PSTVNC_MPEG_DECODER_INITIALIZE_FAILED': 'Reports failure from the injected decoder initialization operation.',
              'PSTVNC_MPEG_DECODER_SEQUENCE_INVALID': 'Reports decoder sequence dimensions that violate explicit caller bounds.',
              'PSTVNC_MPEG_DECODER_TRANSPORT_FAILED': 'Reports a real non-exhaustion Transport result seen by the decoder feed callback.',
              'PSTVNC_MPEG_DECODER_TRANSFER_FAILED': 'Reports failure while submitting the aligned feed transfer to the platform decoder.',
              'PSTVNC_MPEG_DECODER_PICTURE_FAILED': 'Reports an explicit failure return from the decoder picture operation.',
              'PSTVNC_MPEG_DECODER_UNEXPECTED_END': 'Reports a normal-looking decoder return that had neither real exhaustion nor owner stop.',
              'PSTVNC_MPEG_DECODER_SYNC_FAILED': 'Reports failure of injected synchronization guarding stop or call ownership.',
              'PSTVNC_MPEG_DECODER_CALL_ACTIVE': 'Refuses resource release while an active decoder call still owns decoder-visible state.',
              'PSTVNC_MPEG_DECODER_DESTROY_FAILED': 'Reports failure while destroying an initialized decoder after call ownership returns.',
              'PSTVNC_MPEG_DECODER_STATE_RELEASE_FAILED': 'Reports failure while releasing prepared known decoder platform state.',
              'PSTVNC_MPEG_DECODER_ACCOUNTING_FAILED': 'Reports overflow or inconsistency in payload-versus-transfer byte accounting.',
          }

          special = {
              'pstvnc_transport_mpeg_channel_config': 'Groups explicit caller-owned MPEG queue and credit authority; it contains no guessed production defaults.',
              'pstvnc_transport_mpeg_channel_config_t': 'Names the immutable caller-owned MPEG queue and credit configuration contract.',
              'pstvnc_transport_mpeg_channel': 'Owns bounded MPEG ring-buffer state plus the independent finite-producer completion fact.',
              'pstvnc_transport_mpeg_channel_t': 'Names the Transport-owned bounded MPEG logical-channel state.',
              'pstvnc_mpeg_decoder_config': 'Groups explicit caller-supplied sequence, pixel, feed-payload, and alignment bounds for one decoder owner.',
              'pstvnc_mpeg_decoder_config_t': 'Names the caller-owned decoder resource and sequence-bound authority.',
              'pstvnc_mpeg_decoder_memory_ops': 'Defines the injected aligned memory allocation boundary used by decoder-owned buffers.',
              'pstvnc_mpeg_decoder_memory_ops_t': 'Names the injected decoder buffer allocation and release operation table.',
              'pstvnc_mpeg_decoder_sync_ops': 'Defines the injected lock boundary protecting stop state and decoder-call ownership.',
              'pstvnc_mpeg_decoder_sync_ops_t': 'Names the decoder owner synchronization operation table.',
              'pstvnc_mpeg_decoder_platform_ops': 'Defines the injected known-state, decoder-call, feed-transfer, destruction, and state-release boundary.',
              'pstvnc_mpeg_decoder_platform_ops_t': 'Names the injected decoder platform operation table.',
              'pstvnc_mpeg_decoder_result': 'Enumerates truthful decoder completion, cancellation, Transport, platform, bounds, synchronization, and lifecycle outcomes.',
              'pstvnc_mpeg_decoder_result_t': 'Names the decoder terminal-result classification.',
              'pstvnc_mpeg_decoder_report': 'Collects validated sequence dimensions, picture/feed counts, payload-versus-transfer accounting, and the last Transport result.',
              'pstvnc_mpeg_decoder_report_t': 'Names the decoder execution report returned to its caller.',
              'pstvnc_mpeg_decoder': 'Owns decoder resources, injected boundaries, stop state, active-call lifetime, feed state, and the accumulated report.',
              'pstvnc_mpeg_decoder_t': 'Names the session-scoped MPEG decoder owner state.',
              'pstvnc_mpeg_feed_callback_t': 'Names the decoder data callback contract that supplies bytes or truthful EOF/error from Transport.',
              'pstvnc_mpeg_sequence_callback_t': 'Names the decoder sequence callback contract that validates dimensions before surface use.',
              'PSTVNC_MPEG_DECODER_H': 'Guards the clean MPEG decoder ownership interface declarations.',
              'PSTVNC_TRANSPORT_MPEG_CHANNEL_H': 'Guards the bounded logical MPEG channel declarations.',
          }

          def sentence_from_base(base, kind):
              if kind == 'function declaration':
                  return 'Declares the public interface for: ' + base[0].lower() + base[1:]
              return base

          def description(name, kind, owner):
              if name in enum_meaning:
                  return enum_meaning[name]
              if name in special:
                  return special[name]
              if name in exact:
                  return sentence_from_base(exact[name], kind)
              semantic = meaning.get(name)
              if semantic is None:
                  semantic = name.replace('_', ' ')
              if kind in {'parameter', 'prototype parameter'}:
                  return f'Supplies {semantic} to {owner}.'
              if kind == 'field':
                  return f'Stores {semantic} as state owned by {owner}.'
              if kind in {'variable', 'constant', 'array'}:
                  return f'Tracks {semantic} while {owner} executes.'
              if kind in {'structure', 'type', 'enum'}:
                  return f'Represents {semantic} in the A003 Transport/MPEG ownership contract.'
              if kind == 'macro':
                  return f'Names {semantic} required by the A003 Transport/MPEG interface.'
              return f'Represents {semantic} within {owner} for the A003 Transport/MPEG core.'

          def rewrite(path):
              lines = path.read_text().splitlines()
              out = []
              for line in lines:
                  if line.startswith('| ') and 'mechanically reconciled current clean source' in line:
                      cells = [c.strip() for c in line.strip().strip('|').split('|')]
                      if len(cells) != 7:
                          raise SystemExit(f'bad dictionary row: {line}')
                      name, kind, file_name, owner, scope, _desc, _ctx = cells
                      cells[5] = description(name, kind, owner)
                      cells[6] = 'A003 MPEG Transport/decoder core'
                      line = '| ' + ' | '.join(cells) + ' |'
                  out.append(line)
              path.write_text('\n'.join(out).rstrip() + '\n')

          rewrite(root / 'src/transport/SYMBOLS.md')
          rewrite(root / 'src/mpeg/SYMBOLS.md')

          transport = root / 'src/transport/SYMBOLS.md'
          text = transport.read_text()
          old = 'This directory owns the one physical PSTV stream, sole receive owner, framed sequence/serialized send, logical RFB storage and credit, explicit finite-session quiescence, and Transport-owned fatal-session convergence.'
          new = 'This directory owns the one physical PSTV stream and sole receive owner; framed sequence and serialized send; independent bounded logical RFB, AUDIO, and MPEG storage/credit authority; producer-driven media activity wakeups; explicit finite-producer MPEG completion; finite-session quiescence; and Transport-owned terminal convergence. It does not own MPEG decoder resources, exact-generation START/retirement orchestration, presentation, or application policy.'
          if old not in text:
              raise SystemExit('transport dictionary preamble authority changed')
          transport.write_text(text.replace(old, new, 1))
          PY

          python3 scripts/source-dictionary.py check --long --require-complete --strict
          git diff --check
      - name: Commit candidate source dictionaries only
        run: |
          git config user.name 'PS-to-VNC A003 reconstruction evidence'
          git config user.email '39144541+Olsens11@users.noreply.github.com'
          git add src/transport/SYMBOLS.md src/mpeg/SYMBOLS.md
          git commit -m 'docs(a003): stage semantic source dictionaries'
          git push origin HEAD:evidence/a003-p1-host-20260916

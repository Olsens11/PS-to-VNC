              'pstvnc_mpeg_decoder_set_call_active': 'Publishes acquisition or release of decoder-call ownership under the injected state lock.',
              'pstvnc_mpeg_decoder_call_is_active': 'Reads decoder-call ownership under the injected state lock before resource reclamation.',
              'pstvnc_mpeg_decoder_record_transport_failure': 'Records the first non-exhaustion Transport result observed by the decoder feed callback.',
              'pstvnc_mpeg_decoder_feed': 'Feeds a decoder request from real Transport MPEG data, real exhaustion, or real failure without consulting local stop.',
              'pstvnc_mpeg_decoder_sequence': 'Validates decoder-reported sequence dimensions against caller authority before exposing the picture surface.',
              'pstvnc_mpeg_decoder_initialize': 'Allocates bounded resources, establishes known decoder state, and initializes the injected decoder in strict ownership order.',
              'pstvnc_mpeg_decoder_request_stop': 'Records an owner stop request without converting it into decoder feed EOF.',

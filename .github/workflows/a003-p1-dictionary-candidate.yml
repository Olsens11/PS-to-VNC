name: A003 P1 dictionary candidate

on:
  push:
    branches:
      - evidence/a003-p1-host-20260916

permissions:
  contents: write

jobs:
  dictionary-candidate:
    if: github.event.head_commit.message == 'test(a003): seed dictionary candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install definition discovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y universal-ctags shfmt
      - name: Reconcile exact definitions and apply semantic A003 descriptions
        run: |
          set -eu
          cat > src/mpeg/SYMBOLS.md <<'EOF'
          # Clean symbols — `src/mpeg`

          DIRECTORY=src/mpeg
          GENERATION=CLEAN_RECONSTRUCTION
          COVERAGE=COMPLETE

          This directory owns the clean MPEG decoder lifecycle and safe-stop core. It consumes only the public logical MPEG Transport seam, owns explicit caller-supplied feed/sequence/resource bounds, known-state prepare/initialize/picture/destroy ordering, decoder-call lifetime fencing, and truthful payload-versus-padded-transfer accounting. It does not own the physical PSTV receiver, exact-generation START/retirement orchestration, Pi producer/capture control, presentation/compositor work, first-presentation clock arming, scheduling/drop policy, calibration, application orchestration, or hardware qualification.

          The inventory below covers maintained clean-generation symbols defined directly in this directory.

          | Name | Kind | File | Owner | Scope | Description | Context |
          |---|---|---|---|---|---|---|
          EOF

          python3 scripts/reconcile-source-dictionaries.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('reconcile', root / 'scripts/reconcile-source-dictionaries.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          validator = mod.load_validator()
          before, removed, added = mod.reconcile_dictionary(validator, Path('src/mpeg'))
          print(f'DICTIONARY_RECONCILED=src/mpeg before={before} removed={removed} added={added}')

          exact = {
              'pstvnc_transport_runtime_channel_config_valid': 'Validates bounded queue and credit authority shared by logical media channels.',
              'pstvnc_transport_runtime_mpeg_config_valid': 'Validates optional MPEG queue and credit authority against the framed Transport payload limit.',
              'pstvnc_transport_runtime_accept_mpeg_frame': 'Commits one validated channel-4 DATA payload into the bounded MPEG queue owned by the sole receiver.',
              'pstvnc_transport_runtime_initialize_with_mpeg': 'Initializes the sole Transport runtime with explicit MPEG authority and no AUDIO channel.',
              'pstvnc_transport_runtime_initialize_with_audio_mpeg': 'Initializes the sole Transport runtime with independent AUDIO and MPEG logical-channel authority.',
              'pstvnc_transport_runtime_publish_media_activity_locked': 'Advances a logical media activity generation under its queue lock and records whether an armed waiter needs a wake.',
              'pstvnc_transport_runtime_signal_media_activity': 'Signals a logical media activity semaphore only when the locked publication step armed a wake.',
              'pstvnc_transport_runtime_publish_media_terminal': 'Publishes terminal progress to one logical media waiter using the queue-lock generation protocol.',
              'pstvnc_transport_runtime_publish_mpeg_terminal': 'Publishes stop, close, or failure progress to the MPEG activity waiter without inventing exhaustion.',
              'pstvnc_transport_runtime_media_activity_snapshot': 'Snapshots a logical media activity generation while holding the corresponding queue lock.',
              'pstvnc_transport_runtime_media_wait_activity': 'Performs the three-state wake-before-sleep activity wait for one logical media queue.',
              'pstvnc_transport_runtime_media_waiter_live': 'Reports whether a logical media waiter still owns its activity rendezvous while holding the queue lock.',
              'pstvnc_transport_runtime_return_credit': 'Accumulates dequeue-earned credit and emits only the amount justified by bytes actually removed.',
              'pstvnc_transport_runtime_return_mpeg_credit': 'Returns MPEG credit earned by bytes actually removed from the bounded MPEG queue.',
              'pstvnc_transport_runtime_mpeg_read_available': 'Removes currently available MPEG bytes and distinguishes exhaustion, cancellation, close, failure, and temporary starvation.',
              'pstvnc_transport_runtime_mpeg_status': 'Reports MPEG queue occupancy and the independent finite-producer completion fact.',
              'pstvnc_transport_runtime_mpeg_activity_snapshot': 'Returns the current MPEG activity generation for event-driven consumer waits.',
              'pstvnc_transport_runtime_mpeg_wait_activity': 'Waits for MPEG producer, receiver, or terminal activity without timer polling.',
              'pstvnc_transport_runtime_mpeg_mark_producer_done': 'Records one-shot real MPEG producer completion and wakes a waiting consumer.',
              'pstvnc_transport_session_open_with_mpeg': 'Opens the single Transport session with explicit logical MPEG channel authority.',
              'pstvnc_transport_session_open_with_audio_mpeg': 'Opens the single Transport session with independent AUDIO and MPEG logical-channel authority.',
              'pstvnc_transport_mpeg_read_available': 'Exposes bounded MPEG dequeue through the public Transport bridge without exposing the physical socket.',
              'pstvnc_transport_mpeg_status': 'Exposes MPEG occupancy and real producer-completion state through the public bridge.',
              'pstvnc_transport_mpeg_activity_snapshot': 'Exposes the MPEG activity generation used for wake-before-sleep consumer waiting.',
              'pstvnc_transport_mpeg_wait_activity': 'Exposes event-driven MPEG activity waiting through the public bridge.',
              'pstvnc_transport_mpeg_mark_producer_done': 'Records explicit real MPEG producer completion through the public bridge.',
              'pstvnc_transport_mpeg_channel_initialize': 'Binds caller-owned storage as an empty bounded MPEG byte queue with producer completion clear.',
              'pstvnc_transport_mpeg_channel_commit_data': 'Appends one nonempty MPEG DATA payload atomically when bounded queue capacity permits.',

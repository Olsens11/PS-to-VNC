              'config': 'explicit caller-owned configuration authority',
              'mpeg_config': 'explicit MPEG queue and credit authority',
              'audio_config': 'independent AUDIO queue and credit authority',
              'socket_fd': 'the already-owned physical PSTV socket descriptor',
              'queue_capacity': 'bounded logical queue capacity in bytes',
              'initial_credit_bytes': 'initial producer credit authorized by the caller',
              'credit_batch_bytes': 'the dequeue-credit batching threshold',
              'credit_flush_on_empty': 'whether earned credit is flushed when the queue becomes empty',
              'credit_return_enabled': 'whether this logical channel returns dequeue-earned credit',
              'mpeg_enabled': 'whether the logical MPEG path is configured for this session',
              'mpeg_queue_storage': 'caller-sized storage backing the bounded MPEG queue',
              'mpeg_channel': 'the independent bounded MPEG queue state',
              'mpeg_queue_semaphore_id': 'the lock protecting MPEG queue and waiter-visible state',
              'mpeg_activity_semaphore_id': 'the event semaphore used to wake the MPEG consumer',
              'mpeg_activity_sequence': 'the MPEG activity generation used for wake-before-sleep safety',
              'mpeg_activity_wait_armed': 'the three-state MPEG waiter ownership marker',
              'mpeg_credit_pending': 'dequeue-earned MPEG bytes not yet returned as credit',
              'mpeg_initial_credit_bytes': 'initial MPEG credit authorized by the caller',
              'mpeg_credit_batch_bytes': 'the MPEG credit return batching threshold',
              'mpeg_credit_flush_on_empty': 'whether pending MPEG credit flushes when its queue empties',
              'mpeg_credit_return_enabled': 'whether MPEG dequeue earns protocol credit returns',
              'enabled': 'whether the selected logical media channel exists',
              'queue_semaphore_id': 'the queue lock that serializes channel state and waiter ownership',
              'activity_semaphore_id': 'the event semaphore used for producer-driven wakeups',
              'activity_sequence': 'the current producer or terminal activity generation',
              'current_sequence': 'the current activity generation read under the queue lock',
              'observed_sequence': 'the activity generation previously observed by the consumer',
              'activity_wait_armed': 'the three-state waiter ownership marker',
              'waiter_live': 'whether a consumer still owns the activity rendezvous',
              'accepted': 'whether the state transition was accepted without violating channel invariants',
              'signal_waiter': 'whether the newly published generation must wake an armed consumer',
              'header': 'the already validated framed Transport header',
              'payload': 'the framed MPEG payload bytes',
              'payload_length': 'the actual unpadded MPEG payload byte count',
              'buffer': 'the caller destination buffer for logical MPEG bytes',
              'maximum_count': 'the maximum number of bytes the caller permits this read to remove',
              'read_count': 'the number of payload bytes actually removed from Transport',
              'available_count': 'the current MPEG queue occupancy in payload bytes',
              'producer_done': 'the independent one-shot finite-producer completion fact',
              'queue_empty': 'whether the logical queue became empty after the current dequeue',
              'taken': 'the number of bytes actually removed and therefore eligible to earn credit',
              'consumed': 'the actual dequeue byte count eligible to earn credit',
              'pending': 'the accumulator holding earned but not yet emitted credit',
              'batch_bytes': 'the configured threshold for batching earned credit',
              'flush_on_empty': 'the configured policy for flushing earned credit on queue empty',
              'return_enabled': 'whether credit emission is enabled for the logical channel',
              'amount': 'the exact earned credit amount selected for emission',
              'channel': 'the bounded logical MPEG queue being inspected or mutated',

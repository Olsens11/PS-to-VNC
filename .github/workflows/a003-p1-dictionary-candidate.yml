              'macroblock_width': 'the sequence width rounded to the decoder macroblock grid',
              'macroblock_height': 'the sequence height rounded to the decoder macroblock grid',
              'macroblocks': 'the checked macroblock count required by the maximum picture surface',
              'result': 'the first truthful Transport failure classification retained by the decoder owner',

              'pstvnc_mpeg_decoder_platform_ops_valid': 'Verifies the injected known-state, decoder, picture, feed-transfer, and destruction operations are complete.',
              'pstvnc_mpeg_decoder_align_up': 'Rounds a payload size to the injected transfer alignment while rejecting integer overflow.',
              'pstvnc_mpeg_decoder_picture_capacity': 'Computes the macroblock-rounded picture surface capacity from explicit maximum dimensions and pixel width.',
              'pstvnc_mpeg_decoder_free_buffers': 'Releases decoder feed and picture buffers after decoder-call ownership has returned.',

              'pstvnc_mpeg_decoder_config_valid': 'Validates explicit caller-supplied sequence, feed, pixel-width, and alignment bounds without defaults.',
              'pstvnc_mpeg_decoder_memory_ops_valid': 'Verifies the injected decoder memory allocator and releaser are complete.',

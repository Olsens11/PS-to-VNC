name: H1 CP2P Item 10 Documentation Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-item10-seal-wip
    paths:
      - .github/workflows/h1-cp2p-item10-seal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact current-contract and append-only history promotion
        run: |
          set -euo pipefail
          BEFORE_HISTORY=$(sha256sum experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md | cut -d' ' -f1)
          python3 experiments/media-harness-h1/.item10_seal_docs.py
          git diff --check
          grep -Fq 'item #10 exact CP2P all-guns CONFIG/live MPEG activation is DONE' experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md
          grep -Fq '## 43. Item #10' experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          test "$(grep -Fc '## 43. Item #10' experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md)" -eq 1
          echo "HISTORY_BEFORE_SHA256=$BEFORE_HISTORY"
          echo H1_CP2P_ITEM10_DOC_PROMOTION=PASS

      - name: Remove one-shot seal machinery and commit durable docs only
        run: |
          set -euo pipefail
          rm -f \
            experiments/media-harness-h1/.item10_seal_docs.py \
            .github/workflows/h1-cp2p-item10-seal.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs(h1): seal CP2P item10 software activation checkpoint'
          git push origin HEAD:experiment/h1-cp2p-item10-seal-wip

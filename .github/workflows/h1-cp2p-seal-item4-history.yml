### Proof refinements preserved as history

Several failed proof attempts were useful evidence refinements rather than implementation failures, and are intentionally preserved here:

- a first combined proof incorrectly required the forward-integrated CP2O ELF to equal an older whole-file hash even though shared coordinator objects had intentionally evolved;
- the historical source commit for that hash was then recovered as `a9037fd...`, rather than guessed from the later `f200949...` branch checkpoint;
- rebuilding the exact historical commit under a different source path exposed DWARF/source-path sensitivity of the complete ELF hash, so the final identity proof reproduced the original `/repo` path;
- `check_rfb_pcm_interaction.py` was found to be explicitly **CP2O-specific**: it requires `h1_main.o` to reference the bare interaction coordinator. Applying it to CP2P was invalid because CP2P correctly delegates through the session coordinator. The final proof therefore uses that checker for CP2O, while CP2P is proven through its own source contract, inherited mux seam, and linked-symbol assertions.

No production-code behavior was changed merely to satisfy an inapplicable proof check.

### Item #4 final boundary

At this entry, scoreboard item **#4 — Link a real CP2P PS2 target — is complete for the intended pre-Pi software boundary.**

This does **not** claim:

- Pi START receive/validation;
- Pi generation-scoped RFB suppression;
- Pi exact calibrated capture/producer activation;
- a running concurrent PS2 MPEG worker;
- the final visible-RFB + PCM + MPEG CONFIG gate;
- deployment to the PS2;
- physical all-guns behavior;
- hardware qualification or freeze-resolution proof.

Those remain later scoreboard items. The next incomplete implementation item after this seal is **#5 — Pi START receive + validation**.

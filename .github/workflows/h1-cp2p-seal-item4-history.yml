# PHASE L — SEPTEMBER 12 SIBLING-LINE CONVERGENCE AND FINAL ITEM #4 SEAL

## 33. The lifecycle/session-coordinator line and the application-link line are converged before advancing

After the first application-link checkpoint above, repository reconstruction exposed an important branch-lineage fact that had not been visible in the flat narrative: the work described as items #1–#3 and the first implementation of item #4 had been proven on **sibling branches**, not yet in one tree.

The lifecycle/session line was `experiment/h1-cp2p-recalibration-lifecycle`, while the application-link line was `experiment/h1-cp2p-start-wire-accepted`. Both descended from the same earlier working checkpoint, but neither branch alone represented the complete pre-Pi state that the project intended to carry forward.

The lifecycle/session branch had established the deliberately simple fresh-generation recalibration model:

- `START+SELECT` begins a fresh calibration transaction rather than mutating a generation;
- with no MPEG generation, calibration may enter immediately over the current RFB frame;
- with an active or waiting MPEG generation, retire that exact generation first, require a **new full RFB restoration frame**, then freeze that restored full-RFB frame and enter calibration;
- preserve the last confirmed calibration rectangle and matte settings as the seed for the next transaction;
- cancel creates no replacement generation and returns to full-frame RFB + PCM;
- confirm, whether unchanged or resized, creates a fresh higher generation;
- stale retired generations cannot reacquire presentation ownership.

Important contemporaneous milestones on that sibling line included:

- `d2af6c4918b6d9af1123d8704ca97829e6e73271` — fresh recalibration transaction lifecycle;
- `4d307d022a7595da28059d31dd0fa496a10e1f31` — lifecycle wired into the CP2P interaction path;
- `e549daaa4a144b39b6cfc7b00fd2d1f979b8f2ed` — temporary diagnostic cleanup after that proof;
- final sibling-line head `4d56f487357e1c73f6c025ad923c9966e69ab622` — session-owned accepted→START transaction and tightened coordinator boundaries.

That line also established the real session coordinator as the owner of:

- interaction/calibration state;
- the immutable MPEG start handoff/generation;
- combined CP2P RFB flow policy;
- recalibration retirement/restoration state;
- the existing PSTV transport pointer and real transport session id;
- one-shot accepted calibration → `prepare_start()` → serialized START;
- exact-generation START failure abort.

The application-link line, separately, had established the distinct CP2P application target descended from CP2O, the one-public-graphics-owner composition, and pinned PS2 link evidence.

Rather than moving to Pi item #5 with those facts merely *described* as integrated, a new branch was created:

`experiment/h1-cp2p-integrated-pre-pi`

A true two-parent convergence commit preserved both proven histories:

`b45b00b443d79af8096ad7131798eda807ce1b4f`

No qualified historical branch was rewritten. The convergence was also represented by PR #44, which was merged and closed with that same merge commit.

The explicit CP2P target was then made to instantiate and run through the real CP2P session coordinator while leaving the MPEG worker deliberately dormant. CP2O's historical main was restored byte-for-byte and CP2P received its own clearly named CP2O-derived application main instead of using compile-time interception inside the CP2O source.

This entry supersedes the earlier implication that the first item-#4 application-link ELF by itself was a sufficient integrated pre-Pi handoff. That earlier proof remains true for what it actually tested; the later repository reconstruction showed that one more convergence/proof boundary was required before item #4 could be considered closed for forward development.


name: H1 CP2O RFB plus PCM candidate

on:
  push:
    branches:
      - experiment/h1-cp2o-rfb-pcm-prep
      - experiment/h1-rfb-mux-prep
    paths:
      - '.github/workflows/h1-cp2o-rfb-pcm.yml'
      - 'experiments/media-harness-h1/**'
      - 'experiments/audio-transport/common/**'
      - 'mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk'
      - 'mk/media-harness-h1-cumulative39-thread-census.mk'
      - 'mk/media-harness-h1-thread-census-diag.mk'
      - 'src/**'
  workflow_dispatch:

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python/source contracts
        run: |
          python3 -m py_compile \
            experiments/media-harness-h1/h1_mux_server_cumulative39_rfb_pcm_bridge.py \
            experiments/media-harness-h1/check_rfb_pcm_interaction.py \
            experiments/media-harness-h1/h1_tool.py
          python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py

      - name: CP2O CONFIG gate host test
        run: |
          cc -std=c11 -Wall -Wextra \
            -Iexperiments/media-harness-h1 \
            -Iexperiments/audio-transport/common \
            -Dpstvnc_h1_config_validate=pstvnc_h1_config_validate_inner \
            -c experiments/media-harness-h1/h1_config.c \
            -o /tmp/h1_config_inner.o
          cc -std=c11 -Wall -Wextra \
            -Iexperiments/media-harness-h1 \
            -Iexperiments/audio-transport/common \
            experiments/media-harness-h1/h1_config_rfb_pcm_activation_gate_test.c \
            experiments/media-harness-h1/h1_config_rfb_pcm_activation_gate.c \
            experiments/audio-transport/common/transport_protocol.c \
            /tmp/h1_config_inner.o \
            -o /tmp/h1_cp2o_gate_test
          /tmp/h1_cp2o_gate_test

      - name: Canonical H1 tool validate-only profile
        run: |
          python3 experiments/media-harness-h1/h1_tool.py run \
            --runner experiments/media-harness-h1/h1_mux_server_cumulative39_rfb_pcm_bridge.py \
            --profile H1_RFB_ONLY \
            --duration 90 \
            --set rfb_mode=2 \
            --audio pcm \
            --set audio_queue_capacity=524288 \
            --set audio_credit_batch_bytes=4096 \
            --set audio_credit_flush_on_empty=1 \
            --set audio_credit_return_enabled=1 \
            --set audio_initial_credit_bytes=524288 \
            --set audio_start_mode=1 \
            --set audio_start_target_bytes=458752 \
            --set audio_chunk_bytes=4096 \
            --set audio_idle_delay_us=1000 \
            --audio-priority 8 \
            --set audio_thread_stack_size=16384 \
            --set audio_rate=48000 \
            --set audio_channels=2 \
            --set audio_bits=16 \
            --set audio_volume=100 \
            --validate-only

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact CP2O PS2 candidate in pinned PS2DEV image
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD:/repo" \
            -w /repo \
            ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11 \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              BUILD=build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2
              ELF="$BUILD/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF"
              rm -rf "$BUILD"
              make -f mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk
              python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$BUILD"
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$BUILD"
              {
                sha256sum "$ELF"
                stat -c "ELF_BYTES=%s" "$ELF"
                ./scripts/testkit/pt-load-fingerprint.sh "$ELF"
              } | tee cp2o-identity.txt
            '

      - uses: actions/upload-artifact@v4
        with:
          name: h1-cp2o-visible-rfb-interaction-pcm-unqualified-elf
          path: |
            build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF
            cp2o-identity.txt
          if-no-files-found: error

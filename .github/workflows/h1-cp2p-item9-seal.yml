name: H1 CP2P Item 9 Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-ps2-mpeg-worker
    paths:
      - .github/workflows/h1-cp2p-item9-seal.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/h1-cp2p-ps2-mpeg-worker
          fetch-depth: 0
      - name: Append canonical history and remove temporary item 9 CI
        shell: bash
        run: |
          set -euo pipefail
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          EXPECTED_BLOB=c09f6c593fe2ecac395df77ba6cd30ce050a8d30
          ACTUAL_BLOB=$(git hash-object "$HISTORY")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          cp "$HISTORY" /tmp/history.before

          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md')
          entry = r'''

---
# PHASE N — SEPTEMBER 12 GENERATION-BOUND PS2 MPEG WORKER

## 36. Item #9 — concurrent PS2 MPEG worker integration closes at the pre-activation boundary

After item #5 established the real Pi START receive/validation endpoint, work intentionally returned to the PS2 before allowing a valid START to wake a Pi MPEG producer. A new non-destructive continuation branch, `experiment/h1-cp2p-ps2-mpeg-worker`, was created exactly from sealed item-#5 head `c25907162d6f533c14877582196f4b1fdc832d1f`.

The principal lifecycle constraint discovered during implementation was that the existing transport MPEG queue is session-scoped: `pstvnc_h1_transport_mpeg_read()` can block until MPEG bytes arrive or the whole PSTV session receives MEDIA_END. A generation-bound worker therefore could not be retired safely by setting a thread flag alone. The smallest architecture-preserving solution was a consumer-local cancellable MPEG read. The historical `pstvnc_h1_transport_mpeg_read()` API remains as a compatibility wrapper; CP2P uses `pstvnc_h1_transport_mpeg_read_cancellable()` with a worker-owned stop predicate. No second socket, transport reader, queue, sequence owner, or receive thread was introduced.

Item #9 adds `h1_cp2p_mpeg_worker.c/.h`. The worker owns only EE decode-thread, libmpeg, and concrete MPEG-pixel lifetime. The CP2P session coordinator remains the sole authority for presentation-generation state. The worker arms only an exact nonzero generation already in `WAIT_FIRST_FRAME`, stores that generation's immutable START contract, and rejects mismatched/re-entrant arm requests.

Accepted-confirm ordering is now:

`prepare fresh generation -> arm exact worker -> send START`

If worker arm fails, START is not sent and the coordinator aborts the exact prepared generation. If START transmission fails after arm, the coordinator first requires the exact worker to stop/drain/withdraw its concrete MPEG state and only then aborts that generation. If worker clear fails, ownership is not falsely retired underneath a potentially live worker.

The generated CP2P video runtime now accepts the worker stop predicate. Its MPEG feed and prefill waits are cancellable. Explicit worker cancellation exits without independently aborting or stopping presentation ownership; natural pre-first-frame decoder failure retains the existing handoff-abort behavior. First MPEG ownership is still promoted only after decoded presentation reaches the shared compositor and physical `gsKit_sync_flip()` completes.

Recalibration therefore retains one ownership path: worker/pixels clear first, then the existing session/recalibration coordinator retires the exact generation and begins the already-proven full-RFB restoration transaction. Whole-session coordinator shutdown uses the same order for either `WAIT_FIRST_FRAME` or `MPEG_OWNED` state.

The CP2P application target now links the generated compositor-aware `h1_video_runtime_cp2p.o` and `h1_cp2p_mpeg_worker.o`; the inherited standalone `h1_video_runtime.o` may still be compiled by the inherited make dependency graph but is filtered from the final CP2P linker command. The final linked image contains one public graphics owner and the CP2P video-runtime symbols, not the standalone `pstvnc_h1_video_run_session` path.

The public all-guns CONFIG gate remains deliberately unchanged at this checkpoint. CP2P still requires `video_mode=OFF`; in that state the exact-generation worker is armed but decode-thread creation remains dormant. The `MPEG2_ES` live-thread path is compiled and linked for the later gate-opening milestone, but item #9 does not claim an ordinary live-MPEG session, Pi MPEG production, or hardware qualification. Item #10 remains the authority that will expose that path through the public CP2P configuration.

Durable implementation commits before proof:

- `ac4d557184a597004c8739b3d580d11e68dcef6e` — integrate generation-bound CP2P MPEG worker;
- `d1978a57151b410691912626435f923236843dae` — tighten exact worker/coordinator lifecycle edges.

Final software proof source head was `6925034802a5d847bffe09c8d4c783e5db1306bd`. GitHub Actions run `34706240485` completed SUCCESS in the pinned PS2DEV image `ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11`.

Proof evidence included:

- host-contracts job `103586684083` SUCCESS;
- ps2-build job `103586684202` SUCCESS;
- current-tree CP2O RFB/PCM source/object regression PASS;
- current-tree CP2O RFB mux seam PASS;
- CP2P generated video-runtime transform PASS;
- `H1_CP2P_APPLICATION_LINK=PASS`;
- `H1_CP2P_SESSION_COORDINATOR=LIVE`;
- `H1_CP2P_ACCEPT_TO_START=LIVE`;
- `H1_CP2P_GRAPHICS_OWNER=SHARED_COMPOSITOR`;
- `H1_CP2P_MPEG_WORKER=GENERATION_BOUND_GATE_DORMANT`;
- `H1_CP2P_MPEG_CANCELLABLE_READ=LIVE`;
- `H1_CP2P_ITEM9_PS2_LINK=PASS`;
- `H1_CP2P_ITEM9_GENERATION_WORKER=PASS`;
- `H1_CP2P_ITEM9_SINGLE_GRAPHICS_OWNER=PASS`;
- `H1_CP2P_ITEM9_SINGLE_TRANSPORT_READER_ARCHITECTURE=PASS`.

Item-#9 proof artifact identity:

- ELF `PS2VNC-H1-CP2P-ApplicationLink.ELF`;
- SHA256 `89b57d33ce407cfb2420a7ef83819e426d5a2f8a5d1ba3e7a4dd1227c4f2966d`;
- ELF bytes `3228136`;
- PT_LOAD segments `1`;
- PT_LOAD SHA256 `6a33a03b11d282768f1d64c19d45f62b2de071a7bfcd4e0bc5b0cae0bc7da6f5`;
- PT_LOAD bytes `509716`;
- artifact `h1-cp2p-item9-unqualified-elf`, id `10302040505`;
- artifact ZIP SHA256 `8174cbad6912c6037e908361005c86a9fb214e57b2d308224c2f850a89168f2d`.

Two proof refinements were encountered without changing production behavior. First, the existing `check_rfb_pcm_interaction.py` is CP2O-specific and cannot be used against the CP2P-derived main because CP2P correctly reaches interaction through the session coordinator. Second, the inherited make graph still compiles an unused standalone video-runtime object; the meaningful invariant is that it is excluded from the final CP2P link, which was proven by the actual linker command and ELF symbols.

One later lifecycle boundary remains explicit rather than silently solved here: MPEG queue bytes themselves are still session-scoped rather than generation-tagged. Once the Pi producer is live, exact producer stop/drain and stale-generation byte exclusion must be closed as part of item #11's end-to-end data-plane retirement lifecycle. This does not invalidate item #9's worker-lifetime boundary because the public MPEG gate remains closed and the Pi does not yet emit MPEG.

Item #9 introduces no Pi package, process, service, daemon, socket, or dependency requirement, so the generalized Pi bootstrap/prep contract requires no promotion from this PS2-only tranche.

At this entry scoreboard item **#9 — concurrent PS2 MPEG worker integration — OPEN -> DONE** for the intended pre-activation software boundary. The next implementation tranche is the combined Pi-side **#6 — generation-scoped RFB suppression** plus remaining **#7 — exact calibrated capture geometry end-to-end**, still with MPEG production held dormant until #8.
'''
          with p.open('a', encoding='utf-8') as f:
              f.write(entry)
          PY

          cmp -n "$(stat -c %s /tmp/history.before)" /tmp/history.before "$HISTORY"
          grep -Fq '## 36. Item #9 — concurrent PS2 MPEG worker integration closes at the pre-activation boundary' "$HISTORY"
          git diff --check

          git rm \
            .github/workflows/h1-cp2p-item9-implement.yml \
            .github/workflows/h1-cp2p-item9-correct.yml \
            .github/workflows/h1-cp2p-item9-correct2.yml \
            .github/workflows/h1-cp2p-item9-proof.yml \
            .github/workflows/h1-cp2p-item9-seal.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY"
          git commit -m "docs(h1): seal CP2P item 9 checkpoint [skip ci]"
          git push origin HEAD:experiment/h1-cp2p-ps2-mpeg-worker

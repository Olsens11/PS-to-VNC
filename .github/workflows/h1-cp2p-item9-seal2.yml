name: H1 CP2P Item 9 Seal 2

on:
  push:
    branches:
      - experiment/h1-cp2p-ps2-mpeg-worker
    paths:
      - .github/workflows/h1-cp2p-item9-seal2.yml

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/h1-cp2p-ps2-mpeg-worker
          fetch-depth: 0
      - name: Append canonical history and remove temporary item 9 CI
        shell: bash
        run: |
          set -euo pipefail
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          EXPECTED_BLOB=c09f6c593fe2ecac395df77ba6cd30ce050a8d30
          ACTUAL_BLOB=$(git hash-object "$HISTORY")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB"
          cp "$HISTORY" /tmp/history.before
          printf '%s' '...9064 chars truncated...'} | base64 -d >> "$HISTORY"
          cmp -n "$(stat -c %s /tmp/history.before)" /tmp/history.before "$HISTORY"
          grep -Fq '## 36. Item #9 — concurrent PS2 MPEG worker integration closes at the pre-activation boundary' "$HISTORY"
          git diff --check
          git rm .github/workflows/h1-cp2p-item9-implement.yml .github/workflows/h1-cp2p-item9-correct.yml .github/workflows/h1-cp2p-item9-correct2.yml .github/workflows/h1-cp2p-item9-proof.yml .github/workflows/h1-cp2p-item9-seal.yml .github/workflows/h1-cp2p-item9-seal2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY"
          git commit -m "docs(h1): seal CP2P item 9 checkpoint [skip ci]"
          git push origin HEAD:experiment/h1-cp2p-ps2-mpeg-worker

name: Temporary CP2P #4 history append

on:
  push:
    branches:
      - experiment/h1-cp2p-start-wire-accepted
    paths:
      - '.github/workflows/h1-append-cp2p4-history-temp.yml'

permissions:
  contents: write

jobs:
  append-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/h1-cp2p-start-wire-accepted
          fetch-depth: 0

      - name: Append CP2P application-link proof to captain's log
        shell: bash
        run: |
          set -euo pipefail
          LOG=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          PAYLOAD_B64=''
          printf '%s' "$PAYLOAD_B64" | base64 --decode >> "$LOG"
          grep -Fq '# PHASE K — SEPTEMBER 12 CP2P APPLICATION TARGET LINKAGE' "$LOG"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LOG"
          git commit -m 'docs(h1): record CP2P application-link proof'
          git push origin HEAD:experiment/h1-cp2p-start-wire-accepted

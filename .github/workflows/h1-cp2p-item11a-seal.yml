name: H1 CP2P Item 11A Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-pi-retirement-control
    paths:
      - .github/workflows/h1-cp2p-item11a-seal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote item 11A current contract and append history
        run: |
          set -euo pipefail
          CONTRACT=experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          PATCH=experiments/media-harness-h1/.item11a_seal_patch.py
          ENTRY=experiments/media-harness-h1/.item11a_history_append.md

          cp "$HISTORY" /tmp/item11a-history-before.md
          if grep -Fq '## 40. Item #11A closes with Pi-first exact retirement' "$HISTORY"; then
            echo 'item 11A history entry already exists' >&2
            exit 1
          fi

          python3 "$PATCH"
          cat "$ENTRY" >> "$HISTORY"

          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/item11a-history-before.md').read_bytes()
          after = Path('experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md').read_bytes()
          if not after.startswith(before):
              raise SystemExit('captain log prefix changed during item 11A append')
          marker = b'## 40. Item #11A closes with Pi-first exact retirement'
          if after.count(marker) != 1:
              raise SystemExit('item 11A captain-log entry count is not exactly one')
          PY

          grep -Fq 'PSTVNC_H1_FRAME_MPEG_RETIRE = 10' "$CONTRACT"
          grep -Fq 'Pi first' "$CONTRACT"
          grep -Fq 'item #11A exact-generation Pi retirement control is DONE' "$CONTRACT"
          grep -Fq '`#8 -> #11B -> #10 -> #12`' "$HISTORY"
          grep -Fq '5667e14ff412b5848ced30801bac184320ed852a23603072aa13f7a4fcd75ddc' "$HISTORY"

          rm -f \
            "$PATCH" \
            "$ENTRY" \
            .github/workflows/h1-cp2p-item11a-proof.yml \
            .github/workflows/h1-cp2p-item11a-seal.yml

          git diff --check

      - name: Commit sealed item 11A checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'docs(h1): seal CP2P item 11A checkpoint'
          git push origin HEAD:experiment/h1-cp2p-pi-retirement-control

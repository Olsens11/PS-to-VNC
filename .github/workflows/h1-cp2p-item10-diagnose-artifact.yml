name: H1 CP2P Item 10 Diagnostic Artifact

on:
  push:
    branches:
      - experiment/h1-cp2p-item10-live-mpeg-gate-wip
    paths:
      - .github/workflows/h1-cp2p-item10-diagnose-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture patcher output without failing job
        run: |
          set +e
          python3 experiments/media-harness-h1/.item10_preapply_fix.py > item10-pre.log 2>&1
          PRE=$?
          python3 experiments/media-harness-h1/.item10_apply_existing.py > item10-apply.log 2>&1
          APPLY=$?
          {
            echo "PREAPPLY_EXIT=$PRE"
            cat item10-pre.log
            echo "APPLY_EXIT=$APPLY"
            cat item10-apply.log
          } > item10-diagnostic.txt
          cat item10-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: h1-cp2p-item10-patch-diagnostic
          path: item10-diagnostic.txt
          if-no-files-found: error

name: H1 CP2P integrated pre-Pi proof

on:
  push:
    branches: [experiment/h1-cp2p-integrated-pre-pi]

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict MPEG calibration and session contracts
        working-directory: experiments/media-harness-h1/mpeg_presentation_calibration
        run: |
          make -f Makefile.host clean
          make -f Makefile.host test
      - name: Integrated CP2P source contract
        run: |
          set -eu
          TARGET=mk/media-harness-h1-cp2p-application-link.mk
          MAIN=experiments/media-harness-h1/h1_main_cp2p_visible_interaction_pcm.c
          grep -Fq 'include mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk' "$TARGET"
          grep -Fq 'H1_MAIN_SOURCE := experiments/media-harness-h1/h1_main_cp2p_visible_interaction_pcm.c' "$TARGET"
          grep -Fq '$(BUILD_DIR)/h1_cp2p_session_coordinator.o' "$TARGET"
          grep -Fq '$(BUILD_DIR)/h1_mpeg_recalibration.o' "$TARGET"
          grep -Fq 'H1_CP2P_SESSION_COORDINATOR=LIVE' "$TARGET"
          grep -Fq 'pstvnc_h1_audio_load_modules_once(' "$MAIN"
          grep -Fq 'pstvnc_h1_audio_start(' "$MAIN"
          grep -Fq 'pstvnc_h1_audio_finished(' "$MAIN"
          grep -Fq 'pstvnc_h1_audio_shutdown(' "$MAIN"
          grep -Fq 'pstvnc_h1_rfb_session_runtime_run_with_flow_policy(' "$MAIN"
          grep -Fq 'pstvnc_h1_cp2p_session_coordinator_present' "$MAIN"
          grep -Fq 'pstvnc_h1_cp2p_session_coordinator_service' "$MAIN"
          grep -Fq 'pstvnc_h1_cp2p_session_coordinator_rfb_policy' "$MAIN"
          grep -Fq 'PSTVNC_H1_RFB_ON_VISIBLE' "$MAIN"
          grep -Fq 'PSTVNC_H1_VIDEO_OFF' "$MAIN"
          grep -Fq 'h1_cp2p_clear_dormant_mpeg' "$MAIN"
          if grep -Fq 'pstvnc_h1_video_run_cp2p_session(' "$MAIN"; then
            echo H1_CP2P_MAIN_PREMATURE_MPEG_WORKER=FAIL
            exit 1
          fi
          echo H1_CP2P_INTEGRATED_SOURCE_CONTRACT=PASS

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove immutable CP2O anchor and integrated CP2P target
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
          CP2O_ANCHOR: a9037fd12115d48113423394703dfb3e313631b7
          CP2O_ANCHOR_SHA256: 0f30ae41ac7cf77ddf7f0a9d8e2c40639b6cfd03d232363cca3799e79f6969ad
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e CP2O_ANCHOR -e CP2O_ANCHOR_SHA256 -e GITHUB_SHA \
            -v "$PWD:/repo" -w /repo "$IMAGE" -lc '
            set -eu
            apk add --no-cache bash binutils git make python3 >/dev/null
            export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            git config --global --add safe.directory /repo
            CURRENT_SHA="$GITHUB_SHA"

            # Historical identity proof must reproduce the original source path
            # because the ELF carries DWARF/debug path data. Build the proven
            # anchor at /repo, exactly where run 34690484266 built it.
            git checkout --detach "$CP2O_ANCHOR"
            CP2O_BUILD=build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2
            CP2O_ELF="$CP2O_BUILD/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF"
            rm -rf "$CP2O_BUILD"
            make -f mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk
            python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$CP2O_BUILD"
            python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2O_BUILD"
            ANCHOR_SHA=$(sha256sum "$CP2O_ELF" | cut -d" " -f1)
            echo "H1_CP2O_ANCHOR_COMMIT=$CP2O_ANCHOR"
            echo "H1_CP2O_ANCHOR_SHA256=$ANCHOR_SHA"
            test "$ANCHOR_SHA" = "$CP2O_ANCHOR_SHA256"
            ./scripts/testkit/pt-load-fingerprint.sh "$CP2O_ELF"
            echo H1_CP2O_ANCHOR_IDENTITY=PASS

            # Return to the exact integration source commit and prove the
            # current inherited CP2O mechanics plus the unified CP2P target.
            git checkout --detach "$CURRENT_SHA"
            CP2O_BUILD=build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2
            CP2O_ELF="$CP2O_BUILD/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF"
            CP2P_BUILD=build/experiments/media-harness-h1-cp2p-application-link/ps2
            CP2P_ELF="$CP2P_BUILD/PS2VNC-H1-CP2P-ApplicationLink.ELF"
            rm -rf "$CP2O_BUILD" "$CP2P_BUILD"

            make -f mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk
            python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$CP2O_BUILD"
            python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2O_BUILD"
            CURRENT_CP2O_SHA=$(sha256sum "$CP2O_ELF" | cut -d" " -f1)
            echo "H1_CP2O_INTEGRATED_REGRESSION_SHA256=$CURRENT_CP2O_SHA"
            echo H1_CP2O_INTEGRATED_RFB_PCM_REGRESSION=PASS

            make -f mk/media-harness-h1-cp2p-application-link.mk cp2p-application-link-check
            # check_rfb_pcm_interaction.py is intentionally CP2O-specific: it
            # requires h1_main.o to reference the bare interaction coordinator.
            # CP2P correctly delegates through the session coordinator instead.
            # Preserve the inherited transport/mux proof here and prove CP2P
            # application composition through the source contract and ELF symbols.
            python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2P_BUILD"

            mips64r5900el-ps2-elf-nm "$CP2P_ELF" > cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_cp2p_session_coordinator_init$" cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_cp2p_session_coordinator_service$" cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_mpeg_start_handoff_prepare_start$" cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_mpeg_start_transport_send$" cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_mpeg_recalibration_begin$" cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_mpeg_cp2p_rfb_flow_prepare_policy$" cp2p-integrated-symbols.txt
            grep -Eq "[[:space:]]pstvnc_h1_graphics_present_video_macroblocks$" cp2p-integrated-symbols.txt
            test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_init$" cp2p-integrated-symbols.txt)" -eq 1
            test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_present$" cp2p-integrated-symbols.txt)" -eq 1
            test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_shutdown$" cp2p-integrated-symbols.txt)" -eq 1
            if grep -Eq "[[:space:]]pstvnc_h1_video_run_cp2p_session$" cp2p-integrated-symbols.txt; then
              echo H1_CP2P_RUNTIME_PREMATURELY_LINKED=FAIL
              exit 1
            fi
            echo H1_CP2P_INTEGRATED_LINK=PASS
            echo H1_CP2P_MPEG_WORKER=DORMANT

            {
              echo "SOURCE_COMMIT=$CURRENT_SHA"
              sha256sum "$CP2P_ELF"
              stat -c "ELF_BYTES=%s" "$CP2P_ELF"
              ./scripts/testkit/pt-load-fingerprint.sh "$CP2P_ELF"
            } | tee cp2p-integrated-identity.txt
          '
      - uses: actions/upload-artifact@v4
        with:
          name: h1-cp2p-integrated-pre-pi-unqualified-elf
          path: |
            build/experiments/media-harness-h1-cp2p-application-link/ps2/PS2VNC-H1-CP2P-ApplicationLink.ELF
            cp2p-integrated-identity.txt
            cp2p-integrated-symbols.txt
          if-no-files-found: error

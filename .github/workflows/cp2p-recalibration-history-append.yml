name: Append CP2P recalibration history

on:
  push:
    branches:
      - experiment/h1-cp2p-recalibration-lifecycle

permissions:
  contents: write

jobs:
  append-history:
    if: github.event.head_commit.message == 'docs(h1): stage recalibration history append'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append the chronological lifecycle entry and remove this helper
        shell: bash
        run: |
          set -eu
          cat >> experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md <<'EOF'

---

# PHASE J — CLEAN RECALIBRATION TRANSACTION LIFECYCLE

## 31. September 12 — START+SELECT retires any MPEG generation before a fresh calibration transaction

A live design review simplified the MPEG recalibration lifecycle further.

The settled operator rule became:

- START+SELECT always starts a **new calibration transaction**;
- an existing MPEG generation is never edited or evolved in place;
- if no MPEG generation exists, the current RFB desktop may freeze and calibration may enter immediately;
- if a generation exists (including `WAIT_FIRST_FRAME`), its immutable committed region and inner/outer matte settings are preserved as the seed for the new transaction;
- that generation is then retired;
- RFB must return to a new full-frame state after retirement before calibration freezes the screen;
- a full request that was already in flight before retirement is not sufficient, because it may have been produced while the old MPEG suppression footprint still applied;
- after a new post-retirement full RFB update completes, calibration enters using the preserved committed settings;
- confirm creates a **new generation** from the newly committed settings, whether unchanged or edited;
- cancel creates no generation and returns to full-frame RFB + PCM audio.

This intentionally avoids long-running generation mutation history. The only continuity carried between MPEG generations is the user's last confirmed calibration configuration.

Implementation was isolated on:

`experiment/h1-cp2p-recalibration-lifecycle`

from parent:

`2100c573ee2945b64531ce4084e201e6ac9a8329`.

Primary implementation commit:

`d2af6c4918b6d9af1123d8704ca97829e6e73271`

`h1: add clean CP2P recalibration retirement lifecycle`

The implementation added:

- a narrow `h1_mpeg_recalibration` helper that copies the active owner's immutable region/matte state before retirement and returns either `ENTER_NOW` or `WAIT_FOR_FULL_RFB`;
- a tiny restoration watch in `h1_mpeg_cp2p_rfb_flow` that records whether a **new** FULL request was sent after the watch was armed and exposes one completion edge after that request completes;
- strict host tests proving that a pre-existing in-flight FULL cannot satisfy the restoration transition;
- strict host tests proving that the retired generation's region/mattes seed the next calibration, confirm produces a different generation, and cancel leaves the presentation owner `RFB_ONLY`.

Validation run:

`34694084275`

completed successfully. New proof markers included:

- `H1_MPEG_CP2P_RFB_RESTORATION_HOST_TEST=PASS`;
- `H1_MPEG_RECALIBRATION_HOST_TEST=PASS`.

The complete existing strict calibration/START/RFB-flow host suite and live-wiring source check also remained green in that run.

The temporary diagnostic workflow was removed immediately afterward by cleanup commit:

`354fc4c5212fbfcc7f69621c5603b3acf9e91b1e`

`ci(h1): retire recalibration diagnostic workflow`.

Proof boundary at this entry: the lifecycle contract and scheduler behavior are host-proven and experiment-local. This entry does **not** claim that the final CP2P application coordinator, Pi suppression retirement, Pi producer stop/restart, all-guns CONFIG path, or a hardware candidate has yet been completed.
EOF

          rm .github/workflows/cp2p-recalibration-history-append.yml
          git config user.name 'Olsens11'

name: H1 CP2P Item 11B Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-live-generation-boundary

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote item 11B authorities and remove temporary machinery
        run: python3 experiments/media-harness-h1/.item11b_seal.py
      - name: Verify sealed state
        run: |
          set -euo pipefail
          CONTRACT=experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          grep -Fq 'item #11B live cross-machine MPEG generation boundary is DONE at the pre-public-gate software boundary' "$CONTRACT"
          grep -Fq '14d2b5fc68e11756356af397cfe3766e03c89008' "$CONTRACT"
          grep -Fq '34713445142' "$CONTRACT"
          grep -Fq '4f36d9b742598aa64c0bdd15b436ddc1d558b88278139a9a0edc19aa1e2f7ffd' "$CONTRACT"
          test "$(grep -c '^## 42\. Item #11B' "$HISTORY")" -eq 1
          grep -Fq '**one queue, one socket, one receiver, one writer, and an ordered epoch boundary**' "$HISTORY"
          grep -Fq 'Preferred remaining order is **#10 -> #12**' "$HISTORY"
          for path in .github/workflows/h1-cp2p-item11b-generation-boundary.yml experiments/media-harness-h1/.item11b_patch.py experiments/media-harness-h1/.item11b_patch_fix.py experiments/media-harness-h1/.item11b_seal.py; do
            test ! -e "$path"
          done
          git diff --check
          git status --short
          echo H1_CP2P_ITEM11B_SEALED_STATE=PASS
      - name: Commit seal
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(h1): seal CP2P item 11B checkpoint'
          git push origin HEAD:experiment/h1-cp2p-live-generation-boundary

name: H1 CP2P seal item 5 history

on:
  push:
    branches: [experiment/h1-cp2p-pi-start-receive-validation]
    paths:
      - '.github/h1-cp2p-item5-history-trigger'

permissions:
  contents: write

jobs:
  seal-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append item 5 history and remove temporary CI
        env:
          HISTORY_ENTRY_B64: 
        run: |
          set -eu
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          SEAL=.github/workflows/h1-cp2p-seal-item5-history.yml
          PROOF=.github/workflows/h1-cp2p-pi-start-rx.yml
          TRIGGER=.github/h1-cp2p-item5-history-trigger
          EXPECTED_OLD_BLOB=834cb23034662168d23b363a43fa5663080aefee
          test "$(git hash-object "$HISTORY")" = "$EXPECTED_OLD_BLOB"
          cp "$HISTORY" /tmp/history-before.md
          ! grep -q '^## 35\. Item #5 — Pi START receive + validation closes$' "$HISTORY"
          printf '%s' "$HISTORY_ENTRY_B64" | base64 -d >> "$HISTORY"
          OLD_BYTES=$(wc -c < /tmp/history-before.md)
          test "$(wc -c < "$HISTORY")" -gt "$OLD_BYTES"
          cmp -n "$OLD_BYTES" /tmp/history-before.md "$HISTORY"
          echo H1_CP2P_ITEM5_HISTORY_PREFIX_PRESERVED=PASS
          rm "$SEAL" "$PROOF" "$TRIGGER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY" "$SEAL" "$PROOF" "$TRIGGER"
          git diff --cached --check
          git commit -m "docs(h1): seal CP2P item 5 checkpoint"
          git push origin HEAD:experiment/h1-cp2p-pi-start-receive-validation

name: H1 CP2P Item 10 Apply

# Patch transformer preflight is now exact; run the full tranche.
on:
  push:
    branches:
      - experiment/h1-cp2p-item10-live-mpeg-gate-wip
    paths:
      - .github/workflows/h1-cp2p-item10-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-prove-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact item 10 source patch
        run: |
          set -euo pipefail
          python3 experiments/media-harness-h1/.item10_preapply_fix.py
          python3 experiments/media-harness-h1/.item10_apply_existing.py
          git diff --check

      - name: Prove CONFIG gates and Pi lifecycle contracts
        working-directory: experiments/media-harness-h1
        run: |
          set -euo pipefail
          python3 -m py_compile \
            h1_mux_server_cumulative39_rfb_pcm_bridge.py \
            h1_mux_server_cp2p_start_receiver.py \
            h1_cp2p_mpeg_producer.py \
            h1_cp2p_item10_activation_test.py

          cc -std=c11 -Wall -Wextra -Werror \
            -I. -I../audio-transport/common \
            -Dpstvnc_h1_config_validate=pstvnc_h1_config_validate_inner \
            -c h1_config.c -o /tmp/h1_config_inner.o
          cc -std=c11 -Wall -Wextra -Werror \
            -I. -I../audio-transport/common \
            h1_config_cp2p_activation_gate.c \
            h1_config_cp2p_activation_gate_test.c \
            /tmp/h1_config_inner.o \
            -o /tmp/h1_cp2p_item10_gate_test
          /tmp/h1_cp2p_item10_gate_test

          cc -std=c11 -Wall -Wextra -Werror \
            -I. -I../audio-transport/common \
            h1_config_rfb_pcm_activation_gate.c \
            h1_config_rfb_pcm_activation_gate_test.c \
            /tmp/h1_config_inner.o \
            -o /tmp/h1_cp2o_gate_test
          /tmp/h1_cp2o_gate_test

          python3 h1_cp2p_start_receiver_test.py
          python3 h1_rfb_pi_bridge_test.py
          python3 h1_cp2p_rfb_suppression_test.py
          python3 h1_cp2p_capture_geometry_test.py
          python3 h1_cp2p_start_preparation_transaction_test.py
          python3 h1_cp2p_retirement_control_test.py
          python3 h1_cp2p_mpeg_producer_test.py
          python3 h1_cp2p_item10_activation_test.py

          make -C mpeg_presentation_calibration -f Makefile.host clean
          make -C mpeg_presentation_calibration -f Makefile.host test

          cc -std=c11 -Wall -Wextra -Werror \
            -I../audio-transport/common \
            ../audio-transport/common/transport_queue.c \
            ../audio-transport/common/transport_queue_generation_boundary_test.c \
            -o /tmp/h1_queue_generation_boundary_test
          /tmp/h1_queue_generation_boundary_test

          echo H1_CP2P_ITEM10_HOST_CONTRACTS=PASS

      - name: Build CP2O regression and CP2P item10 in pinned PS2DEV
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          docker run --rm \
            --entrypoint /bin/sh \
            -e SOURCE_COMMIT="$SOURCE_COMMIT" \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

              CP2O_BUILD=build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2
              CP2P_BUILD=build/experiments/media-harness-h1-cp2p-application-link/ps2
              CP2O_ELF="$CP2O_BUILD/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF"
              CP2P_ELF="$CP2P_BUILD/PS2VNC-H1-CP2P-ApplicationLink.ELF"
              rm -rf "$CP2O_BUILD" "$CP2P_BUILD"

              make -f mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk
              python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$CP2O_BUILD"
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2O_BUILD"
              test -f "$CP2O_ELF"
              echo H1_CP2O_ITEM10_REGRESSION=PASS

              make -f mk/media-harness-h1-cp2p-application-link.mk cp2p-application-link-check
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2P_BUILD"
              test -f "$CP2P_ELF"

              mips64r5900el-ps2-elf-nm "$CP2P_ELF" > cp2p-item10-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_cp2p_mpeg_worker_arm$" cp2p-item10-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_generation_open$" cp2p-item10-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_transport_mpeg_retire_finalize$" cp2p-item10-symbols.txt
              grep -Fq "H1_CONFIG_RFB_GATE_SOURCE := experiments/media-harness-h1/h1_config_cp2p_activation_gate.c" mk/media-harness-h1-cp2p-application-link.mk
              grep -Fq "config->video_mode != PSTVNC_H1_VIDEO_MPEG2_ES" experiments/media-harness-h1/h1_main_cp2p_visible_interaction_pcm.c
              grep -Fq "mpeg_worker.result.pictures_decoded" experiments/media-harness-h1/h1_main_cp2p_visible_interaction_pcm.c
              grep -Fq "owner.begin_emission_exact(generation)" experiments/media-harness-h1/h1_mux_server_cp2p_start_receiver.py
              grep -Fq "self._emission_retiring = True" experiments/media-harness-h1/h1_cp2p_mpeg_producer.py
              echo H1_CP2P_ITEM10_PS2_LINK=PASS
              echo H1_CP2P_ITEM10_EXACT_LEASE=PASS

              {
                echo "SOURCE_COMMIT=$SOURCE_COMMIT"
                sha256sum "$CP2P_ELF"
                stat -c "ELF_BYTES=%s" "$CP2P_ELF"
                ./scripts/testkit/pt-load-fingerprint.sh "$CP2P_ELF"
              } | tee cp2p-item10-identity.txt
            '

      - name: Commit durable item 10 implementation on WIP branch
        run: |
          set -euo pipefail
          rm -f \
            experiments/media-harness-h1/.item10_preapply_fix.py \
            experiments/media-harness-h1/.item10_apply_existing.py \
            experiments/media-harness-h1/.item10_runner_methods.txt \
            experiments/media-harness-h1/ITEM10_PATCH_DIAGNOSTIC.txt \
            .github/workflows/h1-cp2p-item10-diagnose.yml \
            .github/workflows/h1-cp2p-item10-diagnose-artifact.yml \
            .github/workflows/h1-cp2p-item10-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'h1: open CP2P item10 all-guns activation gate'
          git push origin HEAD:experiment/h1-cp2p-item10-live-mpeg-gate-wip

name: H1 CP2P Item 6 7 Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-pi-suppression-geometry
    paths:
      - .github/workflows/h1-cp2p-item67-seal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote current Pi contract and append history
        run: |
          set -euo pipefail
          HISTORY=experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          ENTRY=experiments/media-harness-h1/.item67_history_append.md
          PATCH=experiments/media-harness-h1/.item67_pi_contract_patch.py
          CONTRACT=experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md

          cp "$HISTORY" /tmp/item67-history-before.md
          if grep -Fq '## 39. Items #6/#7 advance together' "$HISTORY"; then
            echo 'item 6/7 history entry already exists' >&2
            exit 1
          fi

          python3 "$PATCH"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          cat "$ENTRY" >> "$HISTORY"

          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/item67-history-before.md').read_bytes()
          after = Path('experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md').read_bytes()
          if not after.startswith(before):
              raise SystemExit('captain log prefix changed during append')
          if after.count(b'## 39. Items #6/#7 advance together') != 1:
              raise SystemExit('captain log seal entry count is not exactly one')
          PY

          grep -Fq 'item #6 is DONE at the current host/software boundary' "$CONTRACT"
          grep -Fq 'h1_cp2p_start_preparation_transaction_test.py' "$CONTRACT"
          grep -Fq '#11A -> #8 -> #11B -> #10 -> #12' "$HISTORY"

          rm -f "$ENTRY" "$PATCH" .github/workflows/h1-cp2p-item67-seal.yml
          git diff --check

      - name: Commit sealed item 6/7 checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'docs(h1): seal CP2P item 6/7 checkpoint'
          git push origin HEAD:experiment/h1-cp2p-pi-suppression-geometry

name: H1 CP2P promote item 5 into Pi reconstruction contract

on:
  push:
    branches: [experiment/h1-cp2p-pi-start-receive-validation]
    paths:
      - '.github/h1-cp2p-promote-item5-pi-contract-trigger'

permissions:
  contents: write

jobs:
  promote-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote proven item 5 facts into generalized Pi contract
        run: |
          set -eu
          CONTRACT=experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md
          WORKFLOW=.github/workflows/h1-cp2p-promote-item5-pi-contract.yml
          TRIGGER=.github/h1-cp2p-promote-item5-pi-contract-trigger
          EXPECTED_BLOB=fef6040d76b78d5168a13aad144b00871b2e4bc9
          test "$(git hash-object "$CONTRACT")" = "$EXPECTED_BLOB"
          cp "$CONTRACT" /tmp/contract-before.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md')
          s = p.read_text()

          def replace_once(old: str, new: str) -> None:
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one match, found {s.count(old)}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              'Inner matte settings are PS2 presentation state and are intentionally not present on the wire.\n',
              '''Inner matte settings are PS2 presentation state and are intentionally not present on the wire.\n\n### Current Pi implementation authority (item #5)\n\nThe receive/validation side is now concrete and host-proven in the experimental tree. The future comprehensive Pi runtime must absorb the semantics currently implemented by:\n\n- `experiments/media-harness-h1/h1_cp2p_start_receiver.py` — pure START decode/validation, same-reader dispatch, and immutable prepared-generation state;\n- `experiments/media-harness-h1/h1_mux_server_cp2p_start_receiver.py` — narrow CP2P runner integration layered onto the existing visible-RFB/optional-PCM Pi runner;\n- `experiments/media-harness-h1/h1_cp2p_start_receiver_test.py` — focused host contract for valid/invalid START, desktop bounds, generation state, and same-reader dispatch;\n- `experiments/media-harness-h1/CP2P_PI_START_RECEIVE_VALIDATION.md` — item-#5 implementation/proof contract.\n\nThe item-#5 implementation introduces no new external executable, OS package, socket, service, or receive thread. It uses Python 3 and the already-existing H1/RFB Pi runtime environment. Promotion into the comprehensive Pi stack is therefore principally a **runtime/code integration and self-test requirement**, not a new package-install requirement.\n''')

          replace_once(
              'There is no long-running history of edits to one generation.\n',
              '''There is no long-running history of edits to one generation.\n\n### Prepared-generation state proven by item #5\n\nOn the Pi, a structurally valid START does not immediately mean “producer running.” Item #5 introduced an intermediate immutable **prepared request**:\n\n- at most one generation may be prepared at a time;\n- a second START cannot replace an unreleased prepared generation;\n- release must name the exact prepared generation;\n- after a generation has been prepared/released, that generation or any older generation is stale;\n- preparation stores the exact base and suppression rectangles without installing suppression, changing capture geometry, or starting MPEG.\n\nThis prepared state is the handoff that later Pi suppression/capture/producer work must consume rather than reparsing or reconstructing START independently.\n''')

          replace_once(
              '    -> establish generation state\n    -> install generation-scoped RFB suppression\n',
              '''    -> establish immutable prepared-generation state   [implemented/proven in item #5]\n    -> install generation-scoped RFB suppression             [future item #6]\n''')

          replace_once(
              'The current historical mux daemon (`experiments/audio-transport/pi/mux_daemon.py`) already demonstrates the required single-reader/single-writer mux ownership for RFB + PCM, but it does **not** yet implement CP2P START handling or the deferred MPEG producer lifecycle. Experimental implementation may extend or wrap that code while proving the design. The permanent result should ultimately be folded into the comprehensive Pi runtime/bootstrap rather than installed as an unrelated second daemon.\n',
              '''The historical base mux daemon (`experiments/audio-transport/pi/mux_daemon.py`) remains the transport-ownership precedent and does not itself contain CP2P START handling. Item #5 now supplies that handling experimentally through `h1_cp2p_start_receiver.py` and the narrow `h1_mux_server_cp2p_start_receiver.py` wrapper while preserving the same sole-reader call chain. Deferred suppression/capture/producer activation remains unimplemented. The permanent result must fold the proven START receiver/prepared-state semantics into the comprehensive Pi runtime/bootstrap rather than install the experimental wrapper as an unrelated second daemon.\n''')

          replace_once(
              '- valid 44-byte START decodes exactly;\n',
              '''- valid 44-byte START decodes exactly (current host authority: `h1_cp2p_start_receiver_test.py`);\n''')

          replace_once(
              '| MPEG START wire | `mpeg_presentation_calibration/h1_mpeg_start_wire.[ch]` | matching Pi decoder/validator |\n| MPEG START send semantics | `mpeg_presentation_calibration/h1_mpeg_start_transport.[ch]` | inbound channel-4 START routing |\n| generation lifecycle | start-handoff / presentation-owner / recalibration sources | Pi lifecycle state and stale-generation rejection |\n',
              '''| MPEG START wire | PS2: `mpeg_presentation_calibration/h1_mpeg_start_wire.[ch]`; Pi: `h1_cp2p_start_receiver.py` | preserve exact 44-byte decoder/validator and desktop-bound checks |\n| MPEG START receive/routing | `h1_cp2p_start_receiver.py`; `h1_mux_server_cp2p_start_receiver.py` | absorb same-reader DATA/channel-4 routing into permanent Pi runtime; do not create another socket/reader |\n| MPEG START send semantics | `mpeg_presentation_calibration/h1_mpeg_start_transport.[ch]` | preserve compatibility with inbound channel-4 START routing |\n| generation lifecycle | PS2 start-handoff/presentation-owner/recalibration; Pi prepared state in `h1_cp2p_start_receiver.py` | preserve immutable prepared-generation state, exact release, and stale-generation rejection; later extend with producer lifecycle |\n''')

          replace_once(
              '| verification | host tests + later all-guns qualification | fresh-install self-check plus project regression tests |\n',
              '''| verification | item #5: `h1_cp2p_start_receiver_test.py`, proof run `34702828032`; later all-guns qualification | include START decoder/prepared-state/same-reader regression in fresh-install self-check plus project regression tests |\n''')

          replace_once(
              '- START transport sender: `experiments/media-harness-h1/mpeg_presentation_calibration/h1_mpeg_start_transport.[ch]`\n',
              '''- START transport sender: `experiments/media-harness-h1/mpeg_presentation_calibration/h1_mpeg_start_transport.[ch]`\n- Pi START decoder/prepared-state owner: `experiments/media-harness-h1/h1_cp2p_start_receiver.py`\n- Pi START receiver integration runner: `experiments/media-harness-h1/h1_mux_server_cp2p_start_receiver.py`\n- Pi START host contract: `experiments/media-harness-h1/h1_cp2p_start_receiver_test.py`\n- Pi START implementation/proof note: `experiments/media-harness-h1/CP2P_PI_START_RECEIVE_VALIDATION.md`\n''')

          replace_once(
              '- Pi START parsing, generation-scoped suppression, deferred exact-region MPEG producer activation, and explicit Pi retirement signaling are the next implementation work;\n',
              '''- Pi START receive/validation and immutable prepared-generation state are implemented and host-proven by item #5 without adding a second socket, reader, receive thread, producer, or package dependency;\n- generation-scoped suppression, deferred exact-region MPEG producer activation, and explicit Pi retirement signaling remain future implementation work;\n''')

          replace_once(
              '- physical all-guns hardware qualification has not yet occurred.\n',
              '''- item #5 proof authority is branch `experiment/h1-cp2p-pi-start-receive-validation`, tested/documented source head `c37c22c64d159d8f1814a3462ac6dbfa2e0b4557`, GitHub Actions run `34702828032` / job `103577491937`, with 14 focused START tests plus existing RFB regressions passing;\n- the sealed item-#5 branch head is `5a839b16f2d9458bc1e5c4089b90ffc942e4f3e0`;\n- physical all-guns hardware qualification has not yet occurred.\n''')

          p.write_text(s)
          PY
          test "$(git hash-object "$CONTRACT")" != "$EXPECTED_BLOB"
          grep -q 'Current Pi implementation authority (item #5)' "$CONTRACT"
          grep -q 'proof run `34702828032`' "$CONTRACT"
          grep -q 'sealed item-#5 branch head is `5a839b16' "$CONTRACT"
          git diff --check -- "$CONTRACT"
          rm "$WORKFLOW" "$TRIGGER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONTRACT" "$WORKFLOW" "$TRIGGER"
          git diff --cached --check
          git commit -m "docs(h1): promote item 5 into Pi reconstruction contract"
          git push origin HEAD:experiment/h1-cp2p-pi-start-receive-validation

name: H1 CP2P Pi Suppression Geometry

on:
  push:
    branches:
      - experiment/h1-cp2p-pi-suppression-geometry
  workflow_dispatch:

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python modules
        working-directory: experiments/media-harness-h1
        run: |
          python3 -m py_compile \
            h1_cp2p_start_receiver.py \
            h1_cp2p_rfb_suppression.py \
            h1_mux_server_cp2p_start_receiver.py

      - name: Prove existing START receiver contract
        working-directory: experiments/media-harness-h1
        run: python3 h1_cp2p_start_receiver_test.py

      - name: Prove qualified raw RFB bridge contract
        working-directory: experiments/media-harness-h1
        run: python3 h1_rfb_pi_bridge_test.py

      - name: Prove generation-scoped dynamic-desktop suppression
        working-directory: experiments/media-harness-h1
        run: python3 h1_cp2p_rfb_suppression_test.py

name: H1 CP2P Item 10 Documentation Seal

on:
  push:
    branches:
      - experiment/h1-cp2p-item10-live-mpeg-gate-wip
    paths:
      - .github/workflows/h1-cp2p-item10-doc-seal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote item10 contract and append history
        run: |
          set -euo pipefail
          python3 experiments/media-harness-h1/.item10_seal_docs.py
          grep -Fq 'item #10 exact CP2P CONFIG/all-guns activation is DONE' experiments/audio-transport/pi/H1_CP2P_DAEMON_CONTRACT.md
          grep -Fq '# PHASE S — SEPTEMBER 12 ALL-GUNS SOFTWARE ACTIVATION' experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md
          test "$(grep -Fc '# PHASE S — SEPTEMBER 12 ALL-GUNS SOFTWARE ACTIVATION' experiments/media-harness-h1/CP2P_MPEG_CALIBRATION_EXPERIMENT_HISTORY.md)" -eq 1
          git diff --check

      - name: Commit clean durable seal tree
        run: |
          set -euo pipefail
          rm -f \
            experiments/media-harness-h1/.item10_seal_docs.py \
            .github/workflows/h1-cp2p-item10-clean-proof.yml \
            .github/workflows/h1-cp2p-item10-doc-seal.yml
          test ! -e experiments/media-harness-h1/.item10_seal_docs.py
          test ! -e .github/workflows/h1-cp2p-item10-clean-proof.yml
          test ! -e .github/workflows/h1-cp2p-item10-doc-seal.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs(h1): seal item10 all-guns software checkpoint'
          git push origin HEAD:experiment/h1-cp2p-item10-live-mpeg-gate-wip

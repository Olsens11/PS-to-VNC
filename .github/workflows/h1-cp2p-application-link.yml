name: H1 CP2P application link checkpoint

on:
  push:
    branches:
      - experiment/h1-cp2p-start-wire-accepted
    paths:
      - '.github/workflows/h1-cp2p-application-link.yml'
      - 'experiments/media-harness-h1/**'
      - 'experiments/audio-transport/common/**'
      - 'mk/media-harness-h1-cp2p-application-link.mk'
      - 'mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk'
      - 'mk/media-harness-h1-cumulative39-thread-census.mk'
      - 'mk/media-harness-h1-thread-census-diag.mk'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strict MPEG calibration contracts
        working-directory: experiments/media-harness-h1/mpeg_presentation_calibration
        run: |
          make -f Makefile.host clean
          make -f Makefile.host test

      - name: CP2P application-link source contract
        run: |
          set -eu
          TARGET=mk/media-harness-h1-cp2p-application-link.mk
          grep -Fq 'include mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk' "$TARGET"
          grep -Fq 'H1_MAIN_SOURCE := experiments/media-harness-h1/h1_main_rfb_visible_interaction_pcm.c' "$TARGET"
          grep -Fq 'H1_CP2P_MPEG_STARTUP=DORMANT' "$TARGET"
          grep -Fq '$(BUILD_DIR)/h1_mpeg_start_transport.o' "$TARGET"
          grep -Fq 'experiments/media-harness-h1/h1_cumulative39_graphics.c' "$TARGET"
          grep -Fq '$(BUILD_DIR)/ps2_graphics39.o:' "$TARGET"
          echo H1_CP2P_APPLICATION_SOURCE_CONTRACT=PASS

  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CP2O regression and CP2P application target in pinned PS2DEV image
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

              CP2O_BUILD=build/experiments/media-harness-h1-cp2o-visible-rfb-interaction-pcm/ps2
              CP2O_ELF="$CP2O_BUILD/PS2VNC-H1-CP2O-VisibleRFBInteractionPCM.ELF"
              CP2P_BUILD=build/experiments/media-harness-h1-cp2p-application-link/ps2
              CP2P_ELF="$CP2P_BUILD/PS2VNC-H1-CP2P-ApplicationLink.ELF"

              rm -rf "$CP2O_BUILD" "$CP2P_BUILD"

              make -f mk/media-harness-h1-cp2o-visible-rfb-interaction-pcm.mk
              python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$CP2O_BUILD"
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2O_BUILD"

              CP2O_SHA=$(sha256sum "$CP2O_ELF" | cut -d" " -f1)
              test "$CP2O_SHA" = 0f30ae41ac7cf77ddf7f0a9d8e2c40639b6cfd03d232363cca3799e79f6969ad
              echo "H1_CP2O_REGRESSION_SHA256=$CP2O_SHA"

              make -f mk/media-harness-h1-cp2p-application-link.mk cp2p-application-link-check
              python3 experiments/media-harness-h1/check_rfb_pcm_interaction.py --build-dir "$CP2P_BUILD"
              python3 experiments/media-harness-h1/check_rfb_mux_seam.py --build-dir "$CP2P_BUILD"

              mips64r5900el-ps2-elf-nm "$CP2P_ELF" > cp2p-application-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_mpeg_start_handoff_prepare_start$" cp2p-application-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_mpeg_start_transport_send$" cp2p-application-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_mpeg_cp2p_rfb_flow_prepare_policy$" cp2p-application-symbols.txt
              grep -Eq "[[:space:]]pstvnc_h1_graphics_present_video_macroblocks$" cp2p-application-symbols.txt
              grep -Eq "[[:space:]]pstvnc_ps2_graphics_init_base_c39$" cp2p-application-symbols.txt
              test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_init$" cp2p-application-symbols.txt)" -eq 1
              test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_present$" cp2p-application-symbols.txt)" -eq 1
              test "$(grep -Ec "[[:space:]]pstvnc_ps2_graphics_shutdown$" cp2p-application-symbols.txt)" -eq 1

              # #4 is link composition only. The CP2P generated video runtime is
              # deliberately not linked until the later worker/runtime tranche.
              if grep -Eq "[[:space:]]pstvnc_h1_video_run_cp2p_session$" cp2p-application-symbols.txt; then
                echo H1_CP2P_RUNTIME_PREMATURELY_LINKED=FAIL
                exit 1
              fi
              echo H1_CP2P_SINGLE_GRAPHICS_OWNER=PASS
              echo H1_CP2P_DORMANT_LINK_SYMBOLS=PASS

              {
                echo "SOURCE_COMMIT=${GITHUB_SHA:-unknown}"
                sha256sum "$CP2P_ELF"
                stat -c "ELF_BYTES=%s" "$CP2P_ELF"
                ./scripts/testkit/pt-load-fingerprint.sh "$CP2P_ELF"
              } | tee cp2p-application-identity.txt
            '

      - uses: actions/upload-artifact@v4
        with:
          name: h1-cp2p-application-link-unqualified-elf
          path: |
            build/experiments/media-harness-h1-cp2p-application-link/ps2/PS2VNC-H1-CP2P-ApplicationLink.ELF
            cp2p-application-identity.txt
            cp2p-application-symbols.txt
          if-no-files-found: error

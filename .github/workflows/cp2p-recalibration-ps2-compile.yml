name: CP2P recalibration PS2 compile diagnostic

on:
  push:
    branches:
      - experiment/h1-cp2p-recalibration-lifecycle

permissions:
  contents: read

jobs:
  ps2-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile recalibration slice with pinned PS2 toolchain
        env:
          IMAGE: ps2dev/ps2dev@sha256:8fba50ecc2229acd7f8da63d34302f12939b7d4fa6848dda1e6a0ce083321a11
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            -lc '
              set -eu
              apk add --no-cache bash binutils make python3 >/dev/null
              export PATH=/usr/local/ps2dev/bin:/usr/local/ps2dev/ee/bin:/usr/local/ps2dev/iop/bin:/usr/local/ps2dev/dvp/bin:/usr/local/ps2dev/ps2sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              INC="-Iexperiments/media-harness-h1/mpeg_presentation_calibration -Iexperiments/media-harness-h1 -Isrc/input -Isrc/framebuffer -Isrc/rfb"
              ee-gcc -std=c99 -O2 -Wall -Wextra -Werror $INC \
                -c experiments/media-harness-h1/mpeg_presentation_calibration/h1_mpeg_cp2p_rfb_flow.c \
                -o /tmp/h1_mpeg_cp2p_rfb_flow.o
              ee-gcc -std=c99 -O2 -Wall -Wextra -Werror $INC \
                -c experiments/media-harness-h1/mpeg_presentation_calibration/h1_mpeg_recalibration.c \
                -o /tmp/h1_mpeg_recalibration.o
              make -f mk/media-harness-h1-cp2p-compositor-check.mk cp2p-compositor-check
            '

name: H1 CP2P Item 9 Corrections

on:
  push:
    branches:
      - experiment/h1-cp2p-ps2-mpeg-worker
    paths:
      - .github/workflows/h1-cp2p-item9-correct.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/h1-cp2p-ps2-mpeg-worker
          fetch-depth: 0
      - name: Tighten lifecycle edges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p=Path(path); t=p.read_text(); n=t.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(t.replace(old,new,1))

          mk='mk/media-harness-h1-cp2p-application-link.mk'
          once(mk,
              '''EE_OBJS := $(filter-out $(BUILD_DIR)/h1_video_runtime.o,$(EE_OBJS))\nEE_OBJS += $(BUILD_DIR)/h1_video_runtime_cp2p.o\n''',
              '''EE_OBJS := $(filter-out $(BUILD_DIR)/h1_video_runtime.o,$(EE_OBJS))\n''',
              'remove duplicate generated runtime object')

          main='experiments/media-harness-h1/h1_main_cp2p_visible_interaction_pcm.c'
          once(main,
              '''            } else if (!pstvnc_h1_cp2p_session_coordinator_set_mpeg_worker(\n                    &cp2p,\n                    pstvnc_h1_cp2p_mpeg_worker_arm,\n                    &mpeg_worker)) {\n                printf("H1_CP2P=MPEG_WORKER_BIND_FAIL\\n");\n                session_ok = 0;\n            } else {\n                interaction_initialized = 1;\n            }\n''',
              '''            } else {\n                interaction_initialized = 1;\n                if (!pstvnc_h1_cp2p_session_coordinator_set_mpeg_worker(\n                        &cp2p,\n                        pstvnc_h1_cp2p_mpeg_worker_arm,\n                        &mpeg_worker)) {\n                    printf("H1_CP2P=MPEG_WORKER_BIND_FAIL\\n");\n                    session_ok = 0;\n                }\n            }\n''',
              'preserve coordinator shutdown after bind failure')

          worker='experiments/media-harness-h1/h1_cp2p_mpeg_worker.c'
          once(worker,
              '''              if (pstvnc_h1_graphics_clear_video() < 0)\n                  return 0;\n\n              memset(&worker->contract, 0, sizeof(worker->contract));''',
              '''              if (worker->live_decode && pstvnc_h1_graphics_clear_video() < 0)\n                  return 0;\n\n              memset(&worker->contract, 0, sizeof(worker->contract));''',
              'avoid dormant clear side effect')

          coord='experiments/media-harness-h1/h1_cp2p_session_coordinator.c'
          once(coord,
              '''int pstvnc_h1_cp2p_session_coordinator_shutdown(\n    pstvnc_h1_cp2p_session_coordinator_t *coordinator)\n{\n    int result;\n\n    if (coordinator == NULL || !coordinator->initialized)\n        return -1;\n\n    result = pstvnc_h1_interaction_coordinator_shutdown(\n        &coordinator->interaction);\n    coordinator->initialized = 0;\n''',
              '''int pstvnc_h1_cp2p_session_coordinator_shutdown(\n    pstvnc_h1_cp2p_session_coordinator_t *coordinator)\n{\n    pstvnc_h1_mpeg_presentation_owner_state_t owner_state;\n    uint32_t generation;\n    int result;\n\n    if (coordinator == NULL || !coordinator->initialized)\n        return -1;\n\n    owner_state = pstvnc_h1_mpeg_presentation_owner_state(\n        &coordinator->mpeg_handoff.owner);\n    generation = coordinator->mpeg_handoff.owner.generation;\n\n    if (owner_state != PSTVNC_H1_MPEG_PRESENTATION_RFB_ONLY) {\n        if (generation == 0u || coordinator->clear_mpeg == NULL ||\n            !coordinator->clear_mpeg(\n                coordinator->clear_mpeg_context, generation))\n            return -1;\n\n        if (owner_state == PSTVNC_H1_MPEG_PRESENTATION_WAIT_FIRST_FRAME) {\n            if (!pstvnc_h1_mpeg_start_handoff_abort_start(\n                    &coordinator->mpeg_handoff, generation))\n                return -1;\n        } else if (owner_state == PSTVNC_H1_MPEG_PRESENTATION_MPEG_OWNED) {\n            if (!pstvnc_h1_mpeg_start_handoff_stop(\n                    &coordinator->mpeg_handoff, generation))\n                return -1;\n        } else {\n            return -1;\n        }\n        coordinator->current_start_contract_valid = 0;\n    }\n\n    result = pstvnc_h1_interaction_coordinator_shutdown(\n        &coordinator->interaction);\n    coordinator->initialized = 0;\n''',
              'coordinator shutdown retires exact worker first')

          test='experiments/media-harness-h1/test_h1_cp2p_mpeg_worker_contract.py'
          p=Path(test); t=p.read_text()
          marker="assert 'filter-out $(BUILD_DIR)/h1_video_runtime.o' in mk\n"
          if t.count(marker)!=1: raise SystemExit('test insertion marker mismatch')
          t=t.replace(marker, marker+"assert mk.count('$(BUILD_DIR)/h1_video_runtime_cp2p.o') >= 2\nassert 'owner_state != PSTVNC_H1_MPEG_PRESENTATION_RFB_ONLY' in coord\n",1)
          p.write_text(t)
          PY
          git diff --check
          python3 experiments/media-harness-h1/test_h1_cp2p_mpeg_worker_contract.py
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/media-harness-h1 mk/media-harness-h1-cp2p-application-link.mk
          git commit -m "h1: tighten CP2P MPEG worker lifecycle [skip ci]"
          git push origin HEAD:experiment/h1-cp2p-ps2-mpeg-worker
